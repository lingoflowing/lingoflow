<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LingoFlow Analytics v1.5</title>
<style>
body{font-family:sans-serif;max-width:1000px;margin:40px auto;padding:20px;background:#fafafa;color:#222}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid #eee;padding:8px;text-align:left}
.metric{font-weight:bold}
button{padding:10px 16px;border:none;border-radius:8px;cursor:pointer}
ol{margin:0;padding-left:24px}
</style>
</head>
<body>

<h1>LingoFlow Analytics v1.5</h1>

<div class="card">
<h2>Summary</h2>
<table><tbody id="summary"></tbody></table>
</div>

<div class="card">
<h2>Top Cards</h2>
<ol id="topCards"></ol>
</div>

<div class="card">
<h2>Top Completed Cards</h2>
<ol id="topCompletedCards"></ol>
</div>

<div class="card">
<h2>Latest Events</h2>
<table>
<thead><tr><th>Time</th><th>Event</th></tr></thead>
<tbody id="events"></tbody>
</table>
</div>

<div class="card">
<button id="clearBtn">Clear Analytics</button>
</div>

<script>
const STORAGE_KEY='lingoflow_analytics_v1';

const CARD_NAMES={
card_001:'早安',card_002:'早餐',card_003:'茶',card_004:'咖啡',card_005:'陽光',
card_006:'捷運',card_007:'上班',card_008:'窗戶',card_009:'今天',card_010:'散步'
};

function loadEvents(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY))?.events || [];
  }catch{
    return [];
  }
}

function rankCards(events,eventName){
  const counts={};
  events.filter(e=>e.event===eventName).forEach(e=>{
    const id=e.payload?.id;
    if(!id) return;
    counts[id]=(counts[id]||0)+1;
  });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
}

function render(){
  const events=loadEvents();
  const counts={};

  events.forEach(e=>{
    counts[e.event]=(counts[e.event]||0)+1;
  });

  const playStart=counts.play_start||0;
  const cardView=counts.card_view||0;
  const cardComplete=counts.card_complete||0;

  const completionRate=cardView>0?((cardComplete/cardView)*100).toFixed(1):'0.0';
  const cardsPerPlay=playStart>0?(cardView/playStart).toFixed(1):'0.0';

  const learningSessions=new Set(
    events.filter(e=>e.event==='play_start').map(e=>e.sessionId)
  ).size;

  const learningDepth=learningSessions>0?(cardView/learningSessions).toFixed(1):'0.0';

  const avgCompletedPerSession=learningSessions>0
    ? (cardComplete/learningSessions).toFixed(1)
    : '0.0';

  document.getElementById('summary').innerHTML =
    Object.entries(counts).map(([n,c])=>`<tr><td>${n}</td><td>${c}</td></tr>`).join('')
    + `<tr><td class="metric">Completion Rate</td><td class="metric">${completionRate}%</td></tr>
       <tr><td class="metric">Cards Per Play</td><td class="metric">${cardsPerPlay}</td></tr>
       <tr><td class="metric">Learning Sessions</td><td class="metric">${learningSessions}</td></tr>
       <tr><td class="metric">Learning Depth</td><td class="metric">${learningDepth}</td></tr>
       <tr><td class="metric">Average Completed / Session</td><td class="metric">${avgCompletedPerSession}</td></tr>`;

  const topViewed=rankCards(events,'card_view');
  document.getElementById('topCards').innerHTML =
    topViewed.length ? topViewed.map(([id,c])=>`<li>${CARD_NAMES[id]||id} (${c})</li>`).join('') : '<li>No data</li>';

  const topCompleted=rankCards(events,'card_complete');
  document.getElementById('topCompletedCards').innerHTML =
    topCompleted.length ? topCompleted.map(([id,c])=>`<li>${CARD_NAMES[id]||id} (${c})</li>`).join('') : '<li>No data</li>';

  document.getElementById('events').innerHTML =
    [...events].reverse().slice(0,50)
      .map(e=>`<tr><td>${e.at}</td><td>${e.event}</td></tr>`).join('');
}

document.getElementById('clearBtn').addEventListener('click',()=>{
  if(confirm('Analyticsを削除しますか？')){
    localStorage.removeItem(STORAGE_KEY);
    render();
  }
});

render();
</script>
</body>
</html>
