<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>LingoFlow | 台湾華語を聞き流しで学ぶ中国語学習アプリ</title>
  <meta name="description" content="LingoFlowは、台湾華語を聞き流し感覚で学べる無料の中国語学習アプリです。繁体字・ピンイン・日本語対応。">

  <link rel="icon" type="image/png" href="/favicon.png?v=3">
  <link rel="apple-touch-icon" href="/favicon.png?v=3">
  <link rel="manifest" href="/manifest.json">

  <meta name="theme-color" content="#007aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LingoFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <meta property="og:title" content="LingoFlow | 台湾華語を聞き流しで学ぶ">
  <meta property="og:description" content="繁体字・ピンイン・日本語で、台湾華語を自然に聞き流し学習。">
  <meta property="og:image" content="https://lingoflowing.com/ogp.png">
  <meta property="og:url" content="https://lingoflowing.com/">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #eef6ff;
      color: #102030;
      overscroll-behavior: none;
    }

    body {
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      padding-bottom: 120px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(238, 246, 255, 0.95);
      backdrop-filter: blur(12px);
      padding: 14px 0;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 900;
    }

    .subtitle {
      font-size: 13px;
      color: #567;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button, select {
      font: inherit;
    }

    .control-btn, select {
      border: none;
      border-radius: 999px;
      padding: 12px 8px;
      background: #d9ecff;
      color: #0065c8;
      font-weight: 800;
      font-size: 14px;
      text-align: center;
    }

    .control-btn.active {
      background: #007aff;
      color: #fff;
    }

    .card {
      margin-top: 20px;
      background: #fff;
      border-radius: 28px;
      padding: 30px 20px;
      min-height: 340px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .meta {
      font-size: 14px;
      color: #678;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .zh {
      font-size: 34px;
      line-height: 1.4;
      font-weight: 900;
      margin: 8px 0;
    }

    .pinyin, .jp {
      font-size: 25px;
      line-height: 1.4;
      font-weight: 900;
      margin: 8px 0;
    }

    .pinyin {
      color: #24598f;
    }

    .hint {
      margin-top: 22px;
      font-size: 13px;
      color: #789;
    }

    .bottom-bar {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      max-width: 720px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      z-index: 20;
    }

    .action-btn {
      border: none;
      border-radius: 20px;
      padding: 16px;
      font-size: 17px;
      font-weight: 900;
      box-shadow: 0 10px 22px rgba(0,0,0,0.14);
    }

    .primary {
      background: #007aff;
      color: #fff;
    }

    .secondary {
      background: #fff;
      color: #007aff;
    }

    .start-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #eef6ff, #fff);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .start-card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 30px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0,0,0,0.14);
    }

    .start-logo {
      width: 86px;
      height: 86px;
      border-radius: 24px;
      margin-bottom: 16px;
    }

    .start-title {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .start-text {
      color: #567;
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 22px;
    }

    .start-btn {
      width: 100%;
      border: none;
      border-radius: 22px;
      padding: 18px;
      background: #007aff;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
    }

    .home-guide {
      margin-top: 18px;
      background: #eef6ff;
      border-radius: 18px;
      padding: 15px;
      font-size: 13px;
      color: #456;
      line-height: 1.7;
      text-align: left;
    }

    .resume-panel {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: calc(92px + env(safe-area-inset-bottom));
      z-index: 9998;
      max-width: 720px;
      margin: 0 auto;
      background: rgba(255,255,255,0.97);
      border-radius: 22px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.2);
    }

    .resume-panel strong {
      font-size: 15px;
    }

    .resume-panel small {
      color: #678;
    }

    .resume-btn {
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      background: #007aff;
      color: #fff;
      font-weight: 900;
      white-space: nowrap;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div id="startScreen" class="start-screen">
    <div class="start-card">
      <img src="/favicon.png?v=3" class="start-logo" alt="LingoFlow">

      <div class="start-title">LingoFlow</div>

      <div class="start-text">
        台湾華語を聞き流し感覚で自然に学ぶ。<br>
        音声は「タップして開始」後だけ再生されます。
      </div>

      <button id="startBtn" class="start-btn">
        タップして開始
      </button>

      <div class="home-guide">
        <strong>ホーム画面に追加できます</strong><br>
        Safari：共有ボタン →「ホーム画面に追加」<br>
        Chrome：メニュー →「ホーム画面に追加」
      </div>
    </div>
  </div>

  <div id="resumePanel" class="resume-panel hidden">
    <div>
      <strong>再生は停止中です</strong><br>
      <small>タブ移動・スリープ復帰後は手動で再開します</small>
    </div>
    <button id="resumeBtn" class="resume-btn">再開</button>
  </div>

  <div class="app">
    <header>
      <div class="title-row">
        <img src="/favicon.png?v=3" class="logo" alt="LingoFlow">
        <div>
          <h1>LingoFlow</h1>
          <div class="subtitle">台湾華語を聞き流しで学ぶ</div>
        </div>
      </div>

      <div class="controls">
        <button id="modeBtn" class="control-btn active">読む</button>
        <button id="levelBtn" class="control-btn">初級</button>
        <button id="autoBtn" class="control-btn active">聞き流しON</button>
        <select id="categorySelect">
          <option value="all">カテゴリ</option>
        </select>
      </div>
    </header>

    <main class="card">
      <div id="meta" class="meta"></div>
      <div id="zh" class="zh"></div>
      <div id="pinyin" class="pinyin"></div>
      <div id="jp" class="jp"></div>
      <div class="hint">「次へ」で手動再生。聞き流しONなら自動で進みます。</div>
    </main>
  </div>

  <div class="bottom-bar">
    <button id="prevBtn" class="action-btn secondary">前へ</button>
    <button id="nextBtn" class="action-btn primary">次へ</button>
  </div>

<script>
let data = [];
let filtered = [];
let index = 0;

let mode = "read";
let level = "初級";
let category = "all";
let autoPlay = true;

let userStarted = false;
let wasInterruptedByPageHide = false;
let resumeTimer = null;

const sampleData = [
  {
    zh: "你好",
    pinyin: "nǐ hǎo",
    jp: "こんにちは",
    category: "挨拶",
    level: "初級"
  },
  {
    zh: "謝謝你",
    pinyin: "xiè xie nǐ",
    jp: "ありがとうございます",
    category: "挨拶",
    level: "初級"
  }
];

async function loadData() {
  try {
    const res = await fetch("./data.json", { cache: "no-store" });
    data = await res.json();
  } catch (e) {
    data = sampleData;
  }

  setupCategories();
  applyFilter();
}

function setupCategories() {
  const select = document.getElementById("categorySelect");
  const categories = [...new Set(data.map(item => item.category).filter(Boolean))];

  categories.forEach(cat => {
    const option = document.createElement("option");
    option.value = cat;
    option.textContent = cat;
    select.appendChild(option);
  });
}

function applyFilter() {
  filtered = data.filter(item => {
    const levelOk = item.level === level;
    const categoryOk = category === "all" || item.category === category;
    return levelOk && categoryOk;
  });

  if (filtered.length === 0) {
    filtered = sampleData;
  }

  index = 0;
  render();
}

function currentItem() {
  return filtered[index];
}

function render() {
  const item = currentItem();

  document.getElementById("meta").textContent =
    `${item.category || ""} ・ ${item.level || ""}`;

  if (mode === "read") {
    document.getElementById("zh").textContent = item.zh;
    document.getElementById("pinyin").textContent = item.pinyin;
    document.getElementById("jp").textContent = item.jp;
  } else {
    document.getElementById("zh").textContent = item.jp;
    document.getElementById("pinyin").textContent = item.zh;
    document.getElementById("jp").textContent = item.pinyin;
  }
}

function markUserStarted() {
  userStarted = true;
  wasInterruptedByPageHide = false;
  hideResumePanel();
}

function stopAllAudioSafely() {
  clearTimeout(resumeTimer);
  resumeTimer = null;

  try {
    window.speechSynthesis.cancel();
  } catch (e) {}
}

function speakCurrent() {
  if (!userStarted) return;
  if (document.hidden) return;

  stopAllAudioSafely();

  const item = currentItem();
  const utterance = new SpeechSynthesisUtterance(item.zh);
  utterance.lang = "zh-TW";
  utterance.rate = 0.9;

  utterance.onend = () => {
    if (!userStarted) return;
    if (document.hidden) return;
    if (!autoPlay) return;

    resumeTimer = setTimeout(() => {
      nextItem(true);
    }, 1200);
  };

  window.speechSynthesis.speak(utterance);
}

function nextItem(fromAuto = false) {
  stopAllAudioSafely();

  index++;
  if (index >= filtered.length) index = 0;

  render();

  if (userStarted) {
    speakCurrent();
  }
}

function prevItem() {
  stopAllAudioSafely();

  index--;
  if (index < 0) index = filtered.length - 1;

  render();

  if (userStarted) {
    speakCurrent();
  }
}

function showResumePanel() {
  if (!userStarted) return;
  document.getElementById("resumePanel").classList.remove("hidden");
}

function hideResumePanel() {
  document.getElementById("resumePanel").classList.add("hidden");
}

function handlePageHidden() {
  if (userStarted) {
    wasInterruptedByPageHide = true;
  }

  stopAllAudioSafely();
}

function handlePageVisibleAgain() {
  stopAllAudioSafely();

  if (userStarted && wasInterruptedByPageHide) {
    showResumePanel();
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    handlePageHidden();
  } else {
    handlePageVisibleAgain();
  }
});

window.addEventListener("pagehide", () => {
  handlePageHidden();
});

window.addEventListener("pageshow", () => {
  handlePageVisibleAgain();
});

document.getElementById("startBtn").addEventListener("click", () => {
  markUserStarted();
  document.getElementById("startScreen").classList.add("hidden");
  speakCurrent();
});

document.getElementById("resumeBtn").addEventListener("click", () => {
  wasInterruptedByPageHide = false;
  hideResumePanel();
  speakCurrent();
});

document.getElementById("nextBtn").addEventListener("click", () => {
  nextItem(false);
});

document.getElementById("prevBtn").addEventListener("click", () => {
  prevItem();
});

document.getElementById("modeBtn").addEventListener("click", () => {
  mode = mode === "read" ? "speak" : "read";

  const btn = document.getElementById("modeBtn");
  btn.textContent = mode === "read" ? "読む" : "話す";

  render();
});

document.getElementById("levelBtn").addEventListener("click", () => {
  if (level === "初級") {
    level = "中級";
  } else if (level === "中級") {
    level = "上級";
  } else {
    level = "初級";
  }

  document.getElementById("levelBtn").textContent = level;
  applyFilter();
});

document.getElementById("autoBtn").addEventListener("click", () => {
  autoPlay = !autoPlay;

  const btn = document.getElementById("autoBtn");
  btn.textContent = autoPlay ? "聞き流しON" : "聞き流しOFF";
  btn.classList.toggle("active", autoPlay);
});

document.getElementById("categorySelect").addEventListener("change", e => {
  category = e.target.value;
  applyFilter();
});

loadData();
</script>

</body>
</html>
