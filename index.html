<style>

:root{
  --lf-blue:#007aff;
  --lf-blue-2:#0a84ff;
  --lf-ink:#071a3a;
  --lf-muted:#64748b;
  --lf-soft:#eef6ff;
  --lf-card:rgba(255,255,255,.90);
  --lf-line:rgba(15,49,98,.08);
  --lf-shadow:0 18px 48px rgba(15,49,98,.11);
}
*{box-sizing:border-box}
html{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
}
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Hiragino Sans","Yu Gothic","Microsoft JhengHei",sans-serif;
  color:var(--lf-ink);
  background:linear-gradient(135deg,#f8fbff 0%,#edf6ff 52%,#ffffff 100%);
}
button,select{
  font:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.app{
  width:min(760px,100%);
  max-width:760px;
  height:100dvh;
  min-height:0;
  margin:0 auto;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
  background:rgba(255,255,255,.42);
}
.app-header{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding:2px 2px 0;
}
.brand{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
  width:100%;
}
.logo-mark{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#25a6ff 0%,#007aff 68%,#0062d6 100%);
  color:white;
  box-shadow:0 8px 20px rgba(0,122,255,.20), inset 0 1px 1px rgba(255,255,255,.36);
}
.logo-wave{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  width:24px;
  height:20px;
}
.logo-wave i{
  display:block;
  width:3px;
  border-radius:999px;
  background:currentColor;
}
.logo-wave i:nth-child(1){height:10px;opacity:.76}
.logo-wave i:nth-child(2){height:17px}
.logo-wave i:nth-child(3){height:22px}
.logo-wave i:nth-child(4){height:13px;opacity:.82}
.brand-copy{
  display:flex;
  align-items:baseline;
  gap:8px;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
}
.brand-title{
  flex:0 0 auto;
  font-size:21px;
  line-height:1;
  font-weight:950;
  letter-spacing:.15px;
  color:var(--lf-ink);
}
.brand-subtitle{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:12px;
  font-weight:850;
  color:var(--lf-blue);
  letter-spacing:.02em;
}
.header-gear{display:none!important}
.controls{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1.12fr;
  gap:6px;
  align-items:center;
  padding:0;
  margin:0;
  background:transparent;
  border:0;
  box-shadow:none;
}
.controls button,
.controls select{
  min-width:0;
  width:100%;
  height:39px;
  border:1px solid rgba(0,122,255,.10);
  border-radius:999px;
  padding:0 8px;
  color:#15345f;
  background:rgba(255,255,255,.82);
  box-shadow:0 6px 16px rgba(15,49,98,.06), inset 0 1px 0 rgba(255,255,255,.9);
  font-size:14px;
  font-weight:900;
  letter-spacing:.01em;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#viewBtn{
  color:white;
  background:linear-gradient(145deg,#168dff 0%,#006fe8 72%);
  border-color:rgba(0,122,255,.42);
  box-shadow:0 9px 20px rgba(0,122,255,.20), inset 0 1px 1px rgba(255,255,255,.25);
}
.control-icon{display:none!important}
.control-label{display:inline;overflow:hidden;text-overflow:ellipsis}
select#categorySelect{
  appearance:none;
  -webkit-appearance:none;
  padding-right:18px;
  background-image:
    linear-gradient(45deg, transparent 50%, #007aff 50%),
    linear-gradient(135deg, #007aff 50%, transparent 50%),
    linear-gradient(135deg, rgba(255,255,255,.84), rgba(255,255,255,.84));
  background-position:
    calc(100% - 13px) 17px,
    calc(100% - 8px) 17px,
    0 0;
  background-size:5px 5px,5px 5px,100% 100%;
  background-repeat:no-repeat;
}
.box,.list{
  flex:1 1 auto;
  min-height:0;
  position:relative;
  overflow:hidden;
  padding:16px;
  border-radius:26px;
  background:var(--lf-card);
  border:1px solid rgba(255,255,255,.95);
  box-shadow:var(--lf-shadow), inset 0 1px 0 rgba(255,255,255,.92);
}
.list{overflow-y:auto;-webkit-overflow-scrolling:touch}
.box::after,.list::after{display:none}
.question-card-top,
.auto-card-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:0 0 12px;
}
.meta-left{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
  overflow:hidden;
}
.chip{
  display:inline-flex;
  align-items:center;
  min-height:26px;
  padding:5px 10px;
  border-radius:999px;
  background:#eef6ff;
  color:#0068d8;
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.chip svg{display:none}
.counter{
  flex:0 0 auto;
  font-size:14px;
  line-height:1;
  font-weight:900;
  color:#38516f;
  white-space:nowrap;
}
.card-main{
  min-height:0;
  display:block;
}
.lines-wrap{min-width:0}
.line{
  margin:0 0 11px;
  white-space:normal;
  word-break:break-word;
  overflow-wrap:anywhere;
}
.zh,.pinyin,.jp{
  font-weight:900;
  line-height:1.34;
  letter-spacing:.15px;
}
.zh{
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:clamp(30px, 7.8vw, 42px);
  color:#087cff;
  letter-spacing:.35px;
}
.pinyin{
  font-size:clamp(19px, 5.0vw, 25px);
  color:#1174df;
  font-style:italic;
}
.jp{
  font-size:clamp(18px, 4.8vw, 24px);
  color:#12223f;
  font-weight:820;
}
.hidden-line{visibility:hidden}
.hidden-panel{display:none!important}
.voice-button{display:none!important}
.progress-dots{display:none!important}
.level-card{display:none!important}
.status{
  margin-top:10px;
  padding:9px 11px;
  border-radius:14px;
  background:#f1f7ff;
  color:#005bbb;
  font-weight:850;
  font-size:13px;
  line-height:1.35;
}
.question-nav{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
  margin:12px 0 0;
}
.question-nav button{
  height:37px;
  padding:0 6px;
  border:0;
  border-radius:999px;
  color:#005bbb;
  background:#eef6ff;
  border:1px solid rgba(0,122,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85);
  font-size:13px;
  font-weight:900;
  white-space:nowrap;
}
.question-nav button:active,.controls button:active{transform:translateY(1px)}
.char{display:inline;color:#111827!important;transition:color .06s linear,text-shadow .06s linear}
.char.done{color:#007aff!important;text-shadow:0 0 8px rgba(0,122,255,.24)!important}
.list-status{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 12px;
  padding:10px 11px;
  border-radius:16px;
  background:#eef6ff;
  color:#005bbb;
  font-weight:900;
  font-size:13px;
}
.category-title{
  color:#006fe6;
  font-size:16px;
  font-weight:950;
  margin:18px 0 8px;
}
.level-title{
  color:#64748b;
  font-size:13px;
  font-weight:950;
  margin:13px 0 7px;
}
.list-item{
  padding:13px;
  margin:0 0 9px;
  border-radius:18px;
  cursor:pointer;
  user-select:none;
  background:rgba(255,255,255,.68);
  border:1px solid rgba(15,49,98,.06);
  box-shadow:0 5px 14px rgba(15,49,98,.045);
}
.list-item:active{background:rgba(0,122,255,.08)}
.list-item.playing{background:rgba(0,122,255,.07);outline:2px solid rgba(0,122,255,.20)}
.error{background:#fff1f2;color:#9f1239;padding:14px;border-radius:18px;font-weight:900;line-height:1.6}
/* ===== LingoFlow Start Overlay ===== */
#startOverlay{
  position:fixed;
  inset:0;
  z-index:100000;
  pointer-events:auto;
  display:flex;
  align-items:center;
  justify-content:center;

.start-card{
  width:min(390px,92vw);

  border-radius:30px;
  background:rgba(255,255,255,.86);
  border:1px solid rgba(255,255,255,.96);
  box-shadow:0 24px 70px rgba(15,49,98,.15);
  text-align:center;
  backdrop-filter:blur(18px);

.start-card .logo-wave{transform:scale(1.3)}
.logo-title{
  font-size:34px;
  font-weight:950;
  letter-spacing:.2px;
  margin:0 0 8px;
  color:var(--lf-ink);
}
.logo-subtitle{
  font-size:15px;
  font-weight:850;
  line-height:1.5;
  color:#475569;
  margin:0 0 20px;
}
.start-button{
  width:100%;
  height:52px;
  border:0;
  border-radius:999px;
  background:linear-gradient(145deg,#138dff,#006fe6);
  color:white;
  font-size:18px;
  font-weight:950;
  box-shadow:0 12px 26px rgba(0,122,255,.26);
}
.start-note{
  margin-top:12px;
  font-size:12px;
  font-weight:800;
  color:#64748b;
  line-height:1.45;
}
.start-note.audio-unlocked{color:#005bbb}
@media(max-width:640px){
  .app{padding:8px;gap:7px}
  .brand-title{font-size:20px}

"}, {"zh": "可以幫我報警嗎？", "pinyin": "Kěyǐ bāng wǒ bàojǐng ma?", "jp": "警察に通報してもらえますか？", "category": "emergency"}, {"zh": "我真的需要幫忙。", "pinyin": "Wǒ zhēn de xūyào bāngmáng.", "jp": "本当に助けが必要です。", "category": "emergency"}], "advanced": [{"zh": "最近過得還可以嗎？感覺你好像有點忙欸。\n對啊，最近事情真的有點多，不過慢慢習慣了啦。", "pinyin": "Zuìjìn guò de hái kěyǐ ma? Gǎnjué nǐ yǒudiǎn máng ei.\nDuì a, zuìjìn shìqíng zhēn de yǒudiǎn duō, búguò mànmàn xíguàn le la.", "jp": "最近はまあまあ過ごせてる？なんだか少し忙しそうに見えるね。\nうん、最近は本当にやることが少し多いけど、だんだん慣れてきたよ。", "category": "greeting"}, {"zh": "好久不見欸，你最近都在忙什麼啊？\n其實也沒什麼特別，就是工作比較多一點而已。", "pinyin": "Hǎo jiǔ bú jiàn ei, nǐ zuìjìn dōu zài máng shénme a?\nQíshí yě méi shénme tèbié, jiùshì gōngzuò bǐjiào duō yìdiǎn éryǐ.", "jp": "久しぶりだね。最近は何で忙しくしてるの？\n実は特別なことはないんだけど、ただ仕事が少し多いだけだよ。", "category": "greeting"}, {"zh": "你今天看起來精神不錯欸，是不是睡很好？\n對啊，昨天難得沒有熬夜，所以差很多。", "pinyin": "Nǐ jīntiān kàn qǐlái jīngshén búcuò ei, shì bú shì shuì hěn hǎo?\nDuì a, zuótiān nándé méiyǒu áo yè, suǒyǐ chà hěn duō.", "jp": "今日は元気そうに見えるね。よく眠れたの？\nうん、昨日は珍しく夜更かししなかったから、かなり違うよ。", "category": "greeting"}, {"zh": "最近工作還順利嗎？有沒有比較上手一點？\n還可以啦，現在慢慢比較習慣了。", "pinyin": "Zuìjìn gōngzuò hái shùnlì ma? Yǒu méiyǒu bǐjiào shàngshǒu yìdiǎn?\nHái kěyǐ la, xiànzài mànmàn bǐjiào xíguàn le.", "jp": "最近、仕事は順調？少し慣れてきた？\nまあまあかな。今はだんだん少し慣れてきたよ。", "category": "greeting"}, {"zh": "你今天怎麼這麼早來啊？平常不是比較晚？\n因為今天事情比較多，所以想早點處理。", "pinyin": "Nǐ jīntiān zěnme zhème zǎo lái a? Píngcháng bú shì bǐjiào wǎn?\nYīnwèi jīntiān shìqíng bǐjiào duō, suǒyǐ xiǎng zǎo diǎn chǔlǐ.", "jp": "今日はどうしてこんなに早く来たの？いつもはもう少し遅いんじゃない？\n今日はやることが多いから、早めに処理したかったんだ。", "category": "greeting"}, {"zh": "今天看你一直在忙，是不是事情很多啊？\n對啊，一直有新的事情進來，幾乎沒停過。", "pinyin": "Jīntiān kàn nǐ yìzhí zài máng, shì bú shì shìqíng hěn duō a?\nDuì a, yìzhí yǒu xīn de shìqíng jìnlái, jīhū méi tíng guò.", "jp": "今日はずっと忙しそうにしてるね。やることが多いの？\nうん、新しい用事がずっと入ってきて、ほとんど止まる時間がなかったよ。", "category": "greeting"}, {"zh": "最近天氣變冷滿多的，你有沒有多穿一點？\n有啊，不然真的會受不了，溫差太大。", "pinyin": "Zuìjìn tiānqì biàn lěng mǎn duō de, nǐ yǒu méiyǒu duō chuān yìdiǎn?\nYǒu a, bùrán zhēn de huì shòu bù liǎo, wēnchā tài dà.", "jp": "最近かなり寒くなってきたね。ちゃんと多めに着てる？\n着てるよ。そうじゃないと本当に耐えられない。気温差が大きすぎるよ。", "category": "greeting"}, {"zh": "今天過得怎麼樣？感覺你好像還不錯。\n嗯，今天事情都有順利完成，還算輕鬆。", "pinyin": "Jīntiān guò de zěnme yàng? Gǎnjué nǐ hǎoxiàng hái búcuò.\nEn, jīntiān shìqíng dōu yǒu shùnlì wánchéng, hái suàn qīngsōng.", "jp": "今日はどうだった？なんだかまあまあ良さそうに見えるね。\nうん、今日はやることが全部順調に終わったから、わりと楽だったよ。", "category": "greeting"}, {"zh": "你今天看起來有點累，是不是昨天又很晚？\n對啊，昨天忙到很晚，回去就睡了。", "pinyin": "Nǐ jīntiān kàn qǐlái yǒudiǎn lèi, shì bú shì zuótiān yòu hěn wǎn?\nDuì a, zuótiān máng dào hěn wǎn, huíqù jiù shuì le.", "jp": "今日は少し疲れて見えるね。昨日また遅かったの？\nうん、昨日はかなり遅くまで忙しくて、帰ったらそのまま寝たよ。", "category": "greeting"}, {"zh": "最近在忙什麼啊？感覺你好像都沒休息。\n最近在準備新的東西，所以時間都排滿了。", "pinyin": "Zuìjìn zài máng shénme a? Gǎnjué nǐ hǎoxiàng dōu méi xiūxí.\nZuìjìn zài zhǔnbèi xīn de dōngxī, suǒyǐ shíjiān dōu pái mǎn le.", "jp": "最近は何で忙しくしてるの？なんだか全然休めてないみたい。\n最近は新しいことを準備してるから、時間が全部埋まってるんだ。", "category": "greeting"}, {"zh": "這間咖啡店感覺不錯欸，你怎麼找到的？\n朋友推薦的啊，咖啡跟環境都還不錯。", "pinyin": "Zhè jiān kāfēidiàn gǎnjué búcuò ei, nǐ zěnme zhǎodào de?\nPéngyǒu tuījiàn de a, kāfēi gēn huánjìng dōu hái búcuò.", "jp": "このカフェ、いい感じだね。どうやって見つけたの？\n友達にすすめられたんだ。コーヒーも環境もなかなかいいよ。", "category": "cafe"}, {"zh": "你平常會來咖啡店工作嗎？還是在家比較多？\n我比較常來這種地方，比較容易專心。", "pinyin": "Nǐ píngcháng huì lái kāfēidiàn gōngzuò ma? Háishì zài jiā bǐjiào duō?\nWǒ bǐjiào cháng lái zhè zhǒng dìfāng, bǐjiào róngyì zhuānxīn.", "jp": "普段はカフェで仕事するの？それとも家にいることが多い？\n私はこういう場所に来ることが多いよ。その方が集中しやすいから。", "category": "cafe"}, {"zh": "這杯咖啡有點偏酸欸，你覺得呢？\n對，我也覺得，不過還算順口。", "pinyin": "Zhè bēi kāfēi yǒudiǎn piān suān ei, nǐ juéde ne?\nDuì, wǒ yě juéde, búguò hái suàn shùnkǒu.", "jp": "このコーヒー、少し酸味が強いね。どう思う？\nうん、私もそう思う。でもまあ飲みやすい方だね。", "category": "cafe"}, {"zh": "這裡坐滿了欸，要不要換一家？\n也可以，不然等也不一定有位子。", "pinyin": "Zhèlǐ zuò mǎn le ei, yào bú yào huàn yì jiā?\nYě kěyǐ, bùrán děng yě bù yídìng yǒu wèizi.", "jp": "ここ満席だね。他の店に変えない？\nそれでもいいよ。待っても席が空くとは限らないし。", "category": "cafe"}, {"zh": "你覺得這裡可以待久一點嗎？我想慢慢用電腦。\n應該可以啦，只要不是尖峰時間。", "pinyin": "Nǐ juéde zhèlǐ kěyǐ dài jiǔ yìdiǎn ma? Wǒ xiǎng mànmàn yòng diànnǎo.\nYīnggāi kěyǐ la, zhǐyào bú shì jiānfēng shíjiān.", "jp": "ここで少し長くいても大丈夫そう？ゆっくりパソコンを使いたいんだけど。\nたぶん大丈夫だよ。混む時間帯じゃなければね。", "category": "cafe"}, {"zh": "這家店氣氛真的很舒服，會讓人想一直待著。\n對啊，而且音樂也不會太吵。", "pinyin": "Zhè jiā diàn qìfēn zhēn de hěn shūfú, huì ràng rén xiǎng yìzhí dài zhe.\nDuì a, érqiě yīnyuè yě bú huì tài chǎo.", "jp": "この店の雰囲気、本当に居心地がいいね。ずっといたくなる感じ。\nうん、それに音楽もうるさすぎないしね。", "category": "cafe"}, {"zh": "你點咖啡會固定嗎？還是看心情？\n大部分看心情，有時候會亂試。", "pinyin": "Nǐ diǎn kāfēi huì gùdìng ma? Háishì kàn xīnqíng?\nDà bùfèn kàn xīnqíng, yǒu shíhòu huì luàn shì.", "jp": "コーヒーを注文するとき、いつも同じものにする？それとも気分で選ぶ？\nだいたい気分で選ぶよ。たまには適当に試してみることもある。", "category": "cafe"}, {"zh": "第一次來這裡，你會推薦點什麼？\n可以先試招牌，通常不會踩雷。", "pinyin": "Dì yī cì lái zhèlǐ, nǐ huì tuījiàn diǎn shénme?\nKěyǐ xiān shì zhāopái, tōngcháng bú huì cǎi léi.", "jp": "初めてここに来たら、何を頼むのがおすすめ？\nまずは看板メニューを試すといいよ。普通は外れにくいから。", "category": "cafe"}, {"zh": "你今天會待多久？還是等一下就走？\n我應該還會再待一下，慢慢來。", "pinyin": "Nǐ jīntiān huì dài duōjiǔ? Háishì děng yíxià jiù zǒu?\nWǒ yīnggāi hái huì zài dài yíxià, mànmàn lái.", "jp": "今日はどれくらいここにいる予定？それとも少ししたらもう行く？\nたぶんもう少しここにいるよ。ゆっくりでいいから。", "category": "cafe"}, {"zh": "這個甜點看起來不錯欸，要不要點來試試？\n好啊，反正現在也不趕時間。", "pinyin": "Zhège tiándiǎn kàn qǐlái búcuò ei, yào bú yào diǎn lái shìshì?\nHǎo a, fǎnzhèng xiànzài yě bù gǎn shíjiān.", "jp": "このデザート、見た感じよさそうだね。頼んで試してみない？\nいいよ。どうせ今は急いでないし。", "category": "cafe"}, {"zh": "這家店看起來很多人在排隊欸，應該蠻好吃的。\n對啊，不然不會排這麼久，我們等一下好了。", "pinyin": "Zhè jiā diàn kàn qǐlái hěn duō rén zài páiduì ei, yīnggāi mán hǎo chī de.\nDuì a, bùrán bú huì pái zhème jiǔ, wǒmen děng yíxià hǎo le.", "jp": "この店、かなり人が並んでるね。たぶんけっこうおいしいんだろうね。\nうん、そうじゃなかったらこんなに長く並ばないよ。少し待とう。", "category": "restaurant"}, {"zh": "這道菜味道蠻重的欸，你吃得習慣嗎？\n還可以啦，就是有點鹹，下次可以點清淡一點。", "pinyin": "Zhè dào cài wèidào mán zhòng de ei, nǐ chī de xíguàn ma?\nHái kěyǐ la, jiùshì yǒudiǎn xián, xià cì kěyǐ diǎn qīngdàn yìdiǎn.", "jp": "この料理、味がかなり濃いね。食べ慣れてる？\nまあ大丈夫だよ。ただ少ししょっぱいから、次はもう少しあっさりしたものを頼んでもいいね。", "category": "restaurant"}, {"zh": "你覺得這份量夠嗎？還是我們再多點一個？\n我覺得可以再點一道菜，不然有點不夠。", "pinyin": "Nǐ juéde zhè fènliàng gòu ma? Háishì wǒmen zài duō diǎn yí gè?\nWǒ juéde kěyǐ zài diǎn yí dào cài, bùrán yǒudiǎn bú gòu.", "jp": "この量で足りると思う？それとももう一品頼む？\nもう一品頼んでもいいと思う。そうしないと少し足りなさそう。", "category": "restaurant"}, {"zh": "這個湯喝起來很清爽欸，剛好解膩。\n對啊，配這種重口味的剛剛好。", "pinyin": "Zhège tāng hē qǐlái hěn qīngshuǎng ei, gānghǎo jiě nì.\nDuì a, pèi zhè zhǒng zhòng kǒuwèi de gānggāng hǎo.", "jp": "このスープ、飲むとすごくさっぱりしてるね。ちょうど油っこさを消してくれる。\nうん、こういう味の濃い料理と合わせるのにちょうどいいね。", "category": "restaurant"}, {"zh": "你平常會吃這種嗎？還是比較少？\n其實不常，不過偶爾吃還不錯。", "pinyin": "Nǐ píngcháng huì chī zhè zhǒng ma? Háishì bǐjiào shǎo?\nQíshí bù cháng, búguò ǒu'ěr chī hái búcuò.", "jp": "普段こういうの食べる？それともあまり食べない？\n実はあまり食べないけど、たまに食べるとなかなかいいね。", "category": "restaurant"}, {"zh": "這家店氣氛還不錯欸，很適合聊天。\n對啊，而且不會太吵，剛剛好。", "pinyin": "Zhè jiā diàn qìfēn hái búcuò ei, hěn shìhé liáotiān.\nDuì a, érqiě bú huì tài chǎo, gānggāng hǎo.", "jp": "この店、雰囲気がなかなかいいね。おしゃべりするのに向いてる。\nうん、それにうるさすぎなくて、ちょうどいいね。", "category": "restaurant"}, {"zh": "這個可以打包嗎？我真的吃不完。\n可以啊，很多人都會這樣。", "pinyin": "Zhège kěyǐ dǎbāo ma? Wǒ zhēn de chī bù wán.\nKěyǐ a, hěn duō rén dōu huì zhèyàng.", "jp": "これ、持ち帰りできますか？本当に食べきれません。\nできますよ。そうする人は多いです。", "category": "restaurant"}, {"zh": "我們要不要再點一個甜點來吃？\n好啊，剛好想吃點甜的。", "pinyin": "Wǒmen yào bú yào zài diǎn yí gè tiándiǎn lái chī?\nHǎo a, gānghǎo xiǎng chī diǎn tián de.", "jp": "もう一つデザートを頼んで食べない？\nいいね。ちょうど甘いものが少し食べたかったんだ。", "category": "restaurant"}, {"zh": "這個醬料味道很特別欸，你要不要試試看？\n好，我先沾一點點看看味道。", "pinyin": "Zhège jiàngliào wèidào hěn tèbié ei, nǐ yào bú yào shìshì kàn?\nHǎo, wǒ xiān zhān yìdiǎndiǎn kànkan wèidào.", "jp": "このソース、味がかなり独特だね。試してみる？\nうん、まず少しだけつけて味を見てみる。", "category": "restaurant"}, {"zh": "吃完之後我們要不要去走走消化一下？\n好啊，不然真的有點太撐了。", "pinyin": "Chī wán zhīhòu wǒmen yào bú yào qù zǒuzǒu xiāohuà yíxià?\nHǎo a, bùrán zhēn de yǒudiǎn tài chēng le.", "jp": "食べ終わった後、少し歩いて消化しない？\nいいね。そうしないと本当に少し食べすぎた感じがする。", "category": "restaurant"}, {"zh": "這件穿起來感覺不錯欸，不過顏色有點太亮。\n那你可以試旁邊那件，顏色比較低調。", "pinyin": "Zhè jiàn chuān qǐlái gǎnjué búcuò ei, búguò yánsè yǒudiǎn tài liàng.\nNà nǐ kěyǐ shì pángbiān nà jiàn, yánsè bǐjiào dīdiào.", "jp": "これを着るといい感じだけど、色が少し明るすぎるね。\nそれなら横のを試してみたら？色がもう少し落ち着いてるよ。", "category": "shopping"}, {"zh": "這個價格你覺得合理嗎？我有點猶豫。\n以品質來說還可以，不過可以再看看。", "pinyin": "Zhège jiàgé nǐ juéde hélǐ ma? Wǒ yǒudiǎn yóuyù.\nYǐ pǐnzhí lái shuō hái kěyǐ, búguò kěyǐ zài kànkan.", "jp": "この値段、妥当だと思う？ちょっと迷ってるんだ。\n品質から見るとまあ悪くないけど、もう少し見てもいいと思う。", "category": "shopping"}, {"zh": "如果只是平常用，其實不用買太貴的吧。\n對啊，實用比較重要，不用太講究。", "pinyin": "Rúguǒ zhǐshì píngcháng yòng, qíshí bú yòng mǎi tài guì de ba.\nDuì a, shíyòng bǐjiào zhòngyào, bú yòng tài jiǎngjiù.", "jp": "普段使うだけなら、実はあまり高いものを買わなくてもいいよね。\nうん、実用性の方が大事だし、こだわりすぎなくていいよ。", "category": "shopping"}, {"zh": "這裡東西很多欸，反而有點不知道怎麼選。\n那就先看你需要什麼，再慢慢挑。", "pinyin": "Zhèlǐ dōngxī hěn duō ei, fǎn'ér yǒudiǎn bù zhīdào zěnme xuǎn.\nNà jiù xiān kàn nǐ xūyào shénme, zài mànmàn tiāo.", "jp": "ここは物が多いね。逆にどう選べばいいか少し分からなくなる。\nそれならまず必要なものを見て、それからゆっくり選ぼう。", "category": "shopping"}, {"zh": "這雙鞋穿起來很舒服，可是風格不太一樣。\n偶爾換一下也不錯啊，可以試試。", "pinyin": "Zhè shuāng xié chuān qǐlái hěn shūfú, kěshì fēnggé bú tài yíyàng.\nǑu'ěr huàn yíxià yě búcuò a, kěyǐ shìshì.", "jp": "この靴、履くとすごく楽だけど、雰囲気がちょっといつもと違うね。\nたまには変えてみるのも悪くないよ。試してみてもいいと思う。", "category": "shopping"}, {"zh": "如果可以退貨我會比較放心買。\n那你先問清楚規則比較好。", "pinyin": "Rúguǒ kěyǐ tuìhuò wǒ huì bǐjiào fàngxīn mǎi.\nNà nǐ xiān wèn qīngchǔ guīzé bǐjiào hǎo.", "jp": "返品できるなら、もっと安心して買えるんだけど。\nそれなら先にルールをしっかり確認した方がいいよ。", "category": "shopping"}, {"zh": "這個設計很簡單，但看起來很有質感。\n對啊，這種反而比較耐看。", "pinyin": "Zhège shèjì hěn jiǎndān, dàn kàn qǐlái hěn yǒu zhígǎn.\nDuì a, zhè zhǒng fǎn'ér bǐjiào nài kàn.", "jp": "このデザインはとてもシンプルだけど、見た感じかなり質感があるね。\nうん、こういうのの方が逆に長く見ても飽きにくいよ。", "category": "shopping"}, {"zh": "買完這個之後要不要去別的店看看？\n好啊，反正時間還早。", "pinyin": "Mǎi wán zhège zhīhòu yào bú yào qù bié de diàn kànkan?\nHǎo a, fǎnzhèng shíjiān hái zǎo.", "jp": "これを買った後、他の店も見に行かない？\nいいよ。どうせまだ時間も早いし。", "category": "shopping"}, {"zh": "這個尺寸有點小，你要不要拿大一點的？\n好，我試試看大一號。", "pinyin": "Zhège chǐcùn yǒudiǎn xiǎo, nǐ yào bú yào ná dà yìdiǎn de?\nHǎo, wǒ shìshì kàn dà yí hào.", "jp": "このサイズは少し小さいね。もう少し大きいのを持ってきたら？\nうん、ワンサイズ大きいのを試してみる。", "category": "shopping"}, {"zh": "這個真的有點貴欸，我再想一下好了。\n可以啊，不用急著決定。", "pinyin": "Zhège zhēn de yǒudiǎn guì ei, wǒ zài xiǎng yíxià hǎo le.\nKěyǐ a, bú yòng jí zhe juédìng.", "jp": "これは本当に少し高いね。もう少し考えてみることにする。\nいいよ。急いで決めなくて大丈夫だよ。", "category": "shopping"}, {"zh": "現在這時間去市區會很塞欸，你確定要現在出發？\n應該會，不過如果現在不走會更晚到。", "pinyin": "Xiànzài zhè shíjiān qù shìqū huì hěn sāi ei, nǐ quèdìng yào xiànzài chūfā?\nYīnggāi huì, búguò rúguǒ xiànzài bù zǒu huì gèng wǎn dào.", "jp": "今この時間に市内へ行くとかなり渋滞するよ。本当に今出発する？\nたぶん渋滞するけど、今行かなかったらもっと遅く着くよ。", "category": "transport"}, {"zh": "我好像坐錯方向了欸，現在怎麼辦？\n沒關係，下一站下車換回來就好。", "pinyin": "Wǒ hǎoxiàng zuò cuò fāngxiàng le ei, xiànzài zěnme bàn?\nMéi guānxi, xià yí zhàn xià chē huàn huílái jiù hǎo.", "jp": "どうやら反対方向に乗ってしまったみたい。今どうしよう？\n大丈夫。次の駅で降りて戻ればいいよ。", "category": "transport"}, {"zh": "這附近不好叫車欸，我們要不要走到大路？\n好啊，那邊比較好攔車。", "pinyin": "Zhè fùjìn bù hǎo jiào chē ei, wǒmen yào bú yào zǒu dào dà lù?\nHǎo a, nà biān bǐjiào hǎo lán chē.", "jp": "この辺りはタクシーを呼びにくいね。大通りまで歩かない？\nいいよ。あそこならタクシーを捕まえやすいから。", "category": "transport"}, {"zh": "你覺得捷運還是計程車比較快？\n如果不趕時間，我覺得捷運比較穩。", "pinyin": "Nǐ juéde jiéyùn háishì jìchéngchē bǐjiào kuài?\nRúguǒ bù gǎn shíjiān, wǒ juéde jiéyùn bǐjiào wěn.", "jp": "MRTとタクシーなら、どっちの方が早いと思う？\n急いでいないなら、MRTの方が安定してると思う。", "category": "transport"}, {"zh": "這條路看起來比較近，我們要不要走這邊？\n可以試試看，不行再回頭。", "pinyin": "Zhè tiáo lù kàn qǐlái bǐjiào jìn, wǒmen yào bú yào zǒu zhè biān?\nKěyǐ shìshì kàn, bù xíng zài huítóu.", "jp": "この道、見た感じ近そうだね。こっちを歩いてみない？\n試してみてもいいよ。だめならまた戻ればいいし。", "category": "transport"}, {"zh": "我不太確定在哪一站下車，你可以提醒我嗎？\n可以，到前一站我會跟你說。", "pinyin": "Wǒ bù tài quèdìng zài nǎ yí zhàn xià chē, nǐ kěyǐ tíxǐng wǒ ma?\nKěyǐ, dào qián yí zhàn wǒ huì gēn nǐ shuō.", "jp": "どの駅で降りるかあまり確信がないんだけど、教えてくれる？\nいいよ。一つ前の駅になったら言うね。", "category": "transport"}, {"zh": "這班車人有點多欸，要不要等下一班？\n好啊，反正很快就來了。", "pinyin": "Zhè bān chē rén yǒudiǎn duō ei, yào bú yào děng xià yì bān?\nHǎo a, fǎnzhèng hěn kuài jiù lái le.", "jp": "この電車、人が少し多いね。次のを待つ？\nいいよ。どうせすぐ来るから。", "category": "transport"}, {"zh": "從這裡走過去會不會太遠？\n有一點，不過天氣好可以走。", "pinyin": "Cóng zhèlǐ zǒu guòqù huì bú huì tài yuǎn?\nYǒu yìdiǎn, búguò tiānqì hǎo kěyǐ zǒu.", "jp": "ここから歩いて行くと遠すぎるかな？\n少し遠いけど、天気がいいから歩けるよ。", "category": "transport"}, {"zh": "我們現在出發應該還來得及吧？\n應該可以，只要不要拖太久。", "pinyin": "Wǒmen xiànzài chūfā yīnggāi hái lái de jí ba?\nYīnggāi kěyǐ, zhǐyào bú yào tuō tài jiǔ.", "jp": "今出発すれば、まだ間に合うよね？\nたぶん大丈夫。あまり長くぐずぐずしなければね。", "category": "transport"}, {"zh": "這張卡可以直接刷嗎？還是要先加值？\n通常可以直接用，不過餘額要注意。", "pinyin": "Zhè zhāng kǎ kěyǐ zhíjiē shuā ma? Háishì yào xiān jiāzhí?\nTōngcháng kěyǐ zhíjiē yòng, búguò yú'é yào zhùyì.", "jp": "このカードはそのままタッチできますか？それとも先にチャージが必要？\n普通はそのまま使えるけど、残高には注意した方がいいよ。", "category": "transport"}, {"zh": "這間房間還可以，不過隔音有點普通欸。\n對啊，晚上可能會有點吵。", "pinyin": "Zhè jiān fángjiān hái kěyǐ, búguò géyīn yǒudiǎn pǔtōng ei.\nDuì a, wǎnshàng kěnéng huì yǒudiǎn chǎo.", "jp": "この部屋はまあ悪くないけど、防音がちょっと普通だね。\nうん、夜は少しうるさいかもしれないね。", "category": "hotel"}, {"zh": "這裡住起來還算方便，附近什麼都有。\n對，走路就有捷運跟便利商店。", "pinyin": "Zhèlǐ zhù qǐlái hái suàn fāngbiàn, fùjìn shénme dōu yǒu.\nDuì, zǒulù jiù yǒu jiéyùn gēn biànlì shāngdiàn.", "jp": "ここは泊まるにはわりと便利だね。近くに何でもある。\nうん、歩いて行けるところにMRTもコンビニもあるよ。", "category": "hotel"}, {"zh": "可以提早入住就好了，行李有點麻煩。\n先問看看，至少可以寄放。", "pinyin": "Kěyǐ tízǎo rùzhù jiù hǎo le, xínglǐ yǒudiǎn máfan.\nXiān wèn kànkan, zhìshǎo kěyǐ jìfàng.", "jp": "早めにチェックインできたらいいのにね。荷物が少し面倒だし。\n先に聞いてみよう。少なくとも荷物は預けられると思う。", "category": "hotel"}, {"zh": "早餐選擇好像不多欸，你覺得呢？\n還可以啦，不夠的話外面也有。", "pinyin": "Zǎocān xuǎnzé hǎoxiàng bù duō ei, nǐ juéde ne?\nHái kěyǐ la, bú gòu de huà wàimiàn yě yǒu.", "jp": "朝食の選択肢、あまり多くなさそうだね。どう思う？\nまあ大丈夫かな。足りなければ外にもあるし。", "category": "hotel"}, {"zh": "房間有點冷，你知道怎麼調空調嗎？\n我看一下，應該可以調高溫度。", "pinyin": "Fángjiān yǒudiǎn lěng, nǐ zhīdào zěnme tiáo kōngtiáo ma?\nWǒ kàn yíxià, yīnggāi kěyǐ tiáo gāo wēndù.", "jp": "部屋が少し寒いね。エアコンの調整方法分かる？\n見てみるよ。たぶん温度を上げられると思う。", "category": "hotel"}, {"zh": "如果明天要早起，要不要先叫車？\n好啊，比較安心。", "pinyin": "Rúguǒ míngtiān yào zǎoqǐ, yào bú yào xiān jiào chē?\nHǎo a, bǐjiào ānxīn.", "jp": "明日早起きするなら、先に車を呼んでおく？\nうん、その方が安心だね。", "category": "hotel"}, {"zh": "這裡服務還不錯，處理事情也很快。\n對啊，回應都蠻清楚的。", "pinyin": "Zhèlǐ fúwù hái búcuò, chǔlǐ shìqíng yě hěn kuài.\nDuì a, huíyìng dōu mán qīngchǔ de.", "jp": "ここのサービスはなかなかいいね。対応も早い。\nうん、返事もかなり分かりやすいね。", "category": "hotel"}, {"zh": "離車站有點遠，拖行李有點累。\n對，不過搭車就還好。", "pinyin": "Lí chēzhàn yǒudiǎn yuǎn, tuō xínglǐ yǒudiǎn lèi.\nDuì, búguò dā chē jiù hái hǎo.", "jp": "駅から少し遠いね。荷物を引いて歩くと少し疲れる。\nうん。でも車に乗ればまあ大丈夫だよ。", "category": "hotel"}, {"zh": "退房時間是十一點對吧？\n應該是，不過可以再確認。", "pinyin": "Tuìfáng shíjiān shì shíyī diǎn duì ba?\nYīnggāi shì, búguò kěyǐ zài quèrèn.", "jp": "チェックアウト時間は11時で合ってるよね？\nたぶんそうだけど、もう一度確認してもいいね。", "category": "hotel"}, {"zh": "下次來可能還會住這裡，還不錯。\n我也是，整體蠻平衡的。", "pinyin": "Xià cì lái kěnéng hái huì zhù zhèlǐ, hái búcuò.\nWǒ yě shì, zhěngtǐ mán pínghéng de.", "jp": "次に来たら、またここに泊まるかもしれない。なかなかいいね。\n私も。全体的にかなりバランスがいいと思う。", "category": "hotel"}, {"zh": "這個地方真的很漂亮欸，你來過嗎？\n沒有欸，第一次來就覺得很值得。", "pinyin": "Zhège dìfāng zhēn de hěn piàoliang ei, nǐ lái guò ma?\nMéiyǒu ei, dì yī cì lái jiù juéde hěn zhídé.", "jp": "この場所、本当にきれいだね。来たことある？\nないよ。初めて来たけど、すごく来る価値があると思った。", "category": "tourism"}, {"zh": "人有點多，要不要先去別的地方？\n好，等一下再回來拍照。", "pinyin": "Rén yǒudiǎn duō, yào bú yào xiān qù bié de dìfāng?\nHǎo, děng yíxià zài huílái pāizhào.", "jp": "人が少し多いね。先に別の場所へ行かない？\nいいよ。後でもう一度戻って写真を撮ろう。", "category": "tourism"}, {"zh": "這裡大概需要多久逛完？\n慢慢看可能要一個多小時。", "pinyin": "Zhèlǐ dàgài xūyào duōjiǔ guàng wán?\nMànmàn kàn kěnéng yào yí gè duō xiǎoshí.", "jp": "ここは見終わるのにだいたいどれくらい必要？\nゆっくり見るなら1時間以上はかかるかも。", "category": "tourism"}, {"zh": "光線有點強，現在拍照不好看。\n等一下太陽低一點會比較好。", "pinyin": "Guāngxiàn yǒudiǎn qiáng, xiànzài pāizhào bù hǎokàn.\nDěng yíxià tàiyáng dī yìdiǎn huì bǐjiào hǎo.", "jp": "光が少し強いね。今写真を撮ってもあまりきれいに見えない。\nもう少し太陽が低くなったら、もっとよくなるよ。", "category": "tourism"}, {"zh": "我想買紀念品，但不想太觀光客。\n可以找在地設計的東西。", "pinyin": "Wǒ xiǎng mǎi jìniànpǐn, dàn bù xiǎng tài guānguāngkè.\nKěyǐ zhǎo zàidì shèjì de dōngxī.", "jp": "お土産を買いたいけど、あまり観光客っぽすぎるものは嫌だな。\n地元デザインのものを探すといいよ。", "category": "tourism"}, {"zh": "這裡路不好走，鞋子不舒服會很累。\n對，下次要穿好走一點的。", "pinyin": "Zhèlǐ lù bù hǎo zǒu, xiézi bù shūfú huì hěn lèi.\nDuì, xià cì yào chuān hǎo zǒu yìdiǎn de.", "jp": "ここは道が歩きにくいね。靴が合わないとすごく疲れる。\nうん、次はもう少し歩きやすい靴を履かないとね。", "category": "tourism"}, {"zh": "時間夠的話要不要去老街？\n好啊，聽說很多小吃。", "pinyin": "Shíjiān gòu de huà yào bú yào qù lǎojiē?\nHǎo a, tīngshuō hěn duō xiǎochī.", "jp": "時間が足りるなら、老街へ行かない？\nいいね。小吃がたくさんあるって聞いたよ。", "category": "tourism"}, {"zh": "這個介紹寫得很清楚，你看得懂嗎？\n差不多，不懂再查。", "pinyin": "Zhège jièshào xiě de hěn qīngchǔ, nǐ kàn de dǒng ma?\nChàbùduō, bù dǒng zài chá.", "jp": "この説明、かなり分かりやすく書いてあるね。読める？\nだいたい分かるよ。分からないところはあとで調べればいい。", "category": "tourism"}, {"zh": "晚上來應該也很漂亮吧？\n應該是，氣氛會更好。", "pinyin": "Wǎnshàng lái yīnggāi yě hěn piàoliang ba?\nYīnggāi shì, qìfēn huì gèng hǎo.", "jp": "夜に来てもきっときれいだよね？\nたぶんね。雰囲気がもっとよくなると思う。", "category": "tourism"}, {"zh": "今天行程有點滿，要不要刪一個？\n可以，不然太趕了。", "pinyin": "Jīntiān xíngchéng yǒudiǎn mǎn, yào bú yào shān yí gè?\nKěyǐ, bùrán tài gǎn le.", "jp": "今日の予定、少し詰まってるね。一つ削らない？\nいいよ。そうしないと急ぎすぎるから。", "category": "tourism"}, {"zh": "你今天看起來很累，是不是沒睡好？\n對啊，昨天太晚睡了。", "pinyin": "Nǐ jīntiān kàn qǐlái hěn lèi, shì bú shì méi shuì hǎo?\nDuì a, zuótiān tài wǎn shuì le.", "jp": "今日はすごく疲れて見えるね。ちゃんと眠れなかったの？\nうん、昨日寝るのが遅すぎたんだ。", "category": "daily"}, {"zh": "我現在有點餓，要不要一起吃？\n好啊，我也剛好想吃。", "pinyin": "Wǒ xiànzài yǒudiǎn è, yào bú yào yìqǐ chī?\nHǎo a, wǒ yě gānghǎo xiǎng chī.", "jp": "今ちょっとお腹が空いたんだけど、一緒に食べに行かない？\nいいよ。私もちょうど何か食べたいと思ってた。", "category": "daily"}, {"zh": "今天過得好快，一下就晚上了。\n真的，忙起來完全沒感覺。", "pinyin": "Jīntiān guò de hǎo kuài, yíxià jiù wǎnshàng le.\nZhēn de, máng qǐlái wánquán méi gǎnjué.", "jp": "今日は時間が過ぎるのが早かったね。あっという間に夜になった。\n本当だね。忙しくなると全然気づかないよ。", "category": "daily"}, {"zh": "你等一下有空嗎？可以幫我看一下？\n可以，你先傳給我。", "pinyin": "Nǐ děng yíxià yǒu kòng ma? Kěyǐ bāng wǒ kàn yíxià?\nKěyǐ, nǐ xiān chuán gěi wǒ.", "jp": "あとで時間ある？ちょっと見てもらえる？\nいいよ。先に送ってくれれば見るよ。", "category": "daily"}, {"zh": "我今天不想出門，想在家休息。\n也好，偶爾放鬆一下。", "pinyin": "Wǒ jīntiān bù xiǎng chūmén, xiǎng zài jiā xiūxí.\nYě hǎo, ǒu'ěr fàngsōng yíxià.", "jp": "今日は外に出たくない。家で休みたい。\nそれもいいね。たまにはリラックスした方がいいよ。", "category": "daily"}, {"zh": "這件事我還沒決定，再想一下。\n沒關係，不用急。", "pinyin": "Zhè jiàn shì wǒ hái méi juédìng, zài xiǎng yíxià.\nMéi guānxi, bú yòng jí.", "jp": "この件はまだ決めてないから、もう少し考える。\n大丈夫。急がなくていいよ。", "category": "daily"}, {"zh": "這樣安排會不會太趕？\n有點，不過可以試試看。", "pinyin": "Zhèyàng ānpái huì bú huì tài gǎn?\nYǒudiǎn, búguò kěyǐ shìshì kàn.", "jp": "この予定の組み方、ちょっと急ぎすぎかな？\n少しね。でも試してみることはできるよ。", "category": "daily"}, {"zh": "我剛剛忘記帶東西，要回去拿。\n好，我等你。", "pinyin": "Wǒ gānggāng wàngjì dài dōngxī, yào huíqù ná.\nHǎo, wǒ děng nǐ.", "jp": "さっき持ってくる物を忘れたから、戻って取りに行かないと。\nいいよ。待ってるね。", "category": "daily"}, {"zh": "今天真的很熱，我想買飲料。\n我也是，太熱了。", "pinyin": "Jīntiān zhēn de hěn rè, wǒ xiǎng mǎi yǐnliào.\nWǒ yě shì, tài rè le.", "jp": "今日は本当に暑いね。飲み物を買いたい。\n私も。暑すぎるよ。", "category": "daily"}, {"zh": "如果不方便就算了，我可以改天再問。\n沒事，現在可以。", "pinyin": "Rúguǒ bù fāngbiàn jiù suàn le, wǒ kěyǐ gǎitiān zài wèn.\nMéi shì, xiànzài kěyǐ.", "jp": "もし都合が悪ければ大丈夫。また別の日に聞いてもいいから。\n大丈夫。今でもいいよ。", "category": "daily"}, {"zh": "這個我再確認一下，怕會出問題。\n好，確認清楚比較安全。", "pinyin": "Zhège wǒ zài quèrèn yíxià, pà huì chū wèntí.\nHǎo, quèrèn qīngchǔ bǐjiào ānquán.", "jp": "これ、もう一度確認するね。問題が出るのが心配だから。\nうん、はっきり確認した方が安全だね。", "category": "work"}, {"zh": "今天事情很多，我可能晚點回。\n沒關係，你先忙。", "pinyin": "Jīntiān shìqíng hěn duō, wǒ kěnéng wǎn diǎn huí.\nMéi guānxi, nǐ xiān máng.", "jp": "今日はやることが多いから、少し遅く帰るかもしれない。\n大丈夫。先に仕事してて。", "category": "work"}, {"zh": "這資料有點怪，我想再看一次。\n好，小心一點比較好。", "pinyin": "Zhè zīliào yǒudiǎn guài, wǒ xiǎng zài kàn yí cì.\nHǎo, xiǎoxīn yìdiǎn bǐjiào hǎo.", "jp": "この資料、少し変なところがある。もう一回見たい。\nうん、慎重にした方がいいね。", "category": "work"}, {"zh": "這樣排程有點趕。\n那我們先抓重點。", "pinyin": "Zhèyàng páichéng yǒudiǎn gǎn.\nNà wǒmen xiān zhuā zhòngdiǎn.", "jp": "このスケジュール、少し急ぎすぎだね。\nそれなら先に重点を押さえよう。", "category": "work"}, {"zh": "這件我先處理，其他晚點。\n好，我整理資料給你。", "pinyin": "Zhè jiàn wǒ xiān chǔlǐ, qítā wǎn diǎn.\nHǎo, wǒ zhěnglǐ zīliào gěi nǐ.", "jp": "これは先に私が処理して、他のものはあとにする。\n分かった。資料を整理して渡すね。", "category": "work"}, {"zh": "剛剛會議有些沒聽清楚。\n我等一下整理給你。", "pinyin": "Gānggāng huìyì yǒu xiē méi tīng qīngchǔ.\nWǒ děng yíxià zhěnglǐ gěi nǐ.", "jp": "さっきの会議で、聞き取れなかったところが少しある。\nあとで整理して渡すね。", "category": "work"}, {"zh": "這問題今天解不了。\n先找原因比較重要。", "pinyin": "Zhè wèntí jīntiān jiě bù liǎo.\nXiān zhǎo yuányīn bǐjiào zhòngyào.", "jp": "この問題は今日中には解決できない。\n先に原因を見つける方が大事だね。", "category": "work"}, {"zh": "有回覆我再跟你說。\n好，方便安排。", "pinyin": "Yǒu huífù wǒ zài gēn nǐ shuō.\nHǎo, fāngbiàn ānpái.", "jp": "返事が来たらまた言うね。\nうん、その方が予定を組みやすい。", "category": "work"}, {"zh": "這版本先不要發。\n好，再確認。", "pinyin": "Zhè bǎnběn xiān bú yào fā.\nHǎo, zài quèrèn.", "jp": "このバージョンはまだ出さないで。\n分かった。もう一度確認する。", "category": "work"}, {"zh": "今天先做到這裡。\n好，明天再繼續。", "pinyin": "Jīntiān xiān zuò dào zhèlǐ.\nHǎo, míngtiān zài jìxù.", "jp": "今日はまずここまでにしよう。\nうん、明日また続きをやろう。", "category": "work"}, {"zh": "我現在不舒服，可以幫我叫救護車嗎？\n好，我馬上打電話。", "pinyin": "Wǒ xiànzài bù shūfú, kěyǐ bāng wǒ jiào jiùhùchē ma?\nHǎo, wǒ mǎshàng dǎ diànhuà.", "jp": "今体調が悪いです。救急車を呼んでもらえますか？\n分かりました。すぐ電話します。", "category": "emergency"}, {"zh": "我的錢包不見了，剛剛可能掉了。\n先不要急，我們回去找。", "pinyin": "Wǒ de qiánbāo bú jiàn le, gānggāng kěnéng diào le.\nXiān bú yào jí, wǒmen huíqù zhǎo.", "jp": "財布がなくなりました。さっき落としたのかもしれません。\nまず焦らないで。戻って探してみよう。", "category": "emergency"}, {"zh": "我迷路了，手機也快沒電。\n先找店家幫忙。", "pinyin": "Wǒ mílù le, shǒujī yě kuài méi diàn.\nXiān zhǎo diànjiā bāngmáng.", "jp": "道に迷いました。携帯の電池ももうすぐ切れそうです。\nまずお店の人に助けを求めよう。", "category": "emergency"}, {"zh": "這裡不太安全，我們先走。\n好，去人多的地方。", "pinyin": "Zhèlǐ bù tài ānquán, wǒmen xiān zǒu.\nHǎo, qù rén duō de dìfāng.", "jp": "ここはあまり安全ではなさそうです。先に離れましょう。\nうん、人の多い場所へ行こう。", "category": "emergency"}, {"zh": "我受傷了，有點痛。\n先去藥局。", "pinyin": "Wǒ shòushāng le, yǒudiǎn tòng.\nXiān qù yàojú.", "jp": "けがをしました。少し痛いです。\nまず薬局へ行こう。", "category": "emergency"}, {"zh": "我找不到朋友了。\n你先待著，我幫你打電話。", "pinyin": "Wǒ zhǎo bú dào péngyǒu le.\nNǐ xiān dài zhe, wǒ bāng nǐ dǎ diànhuà.", "jp": "友達が見つかりません。\nあなたは先にここにいて。私が電話してあげる。", "category": "emergency"}, {"zh": "護照不見了，我很緊張。\n先報警，再聯絡。", "pinyin": "Hùzhào bú jiàn le, wǒ hěn jǐnzhāng.\nXiān bàojǐng, zài liánluò.", "jp": "パスポートがなくなりました。すごく不安です。\nまず警察に届けて、それから連絡しよう。", "category": "emergency"}, {"zh": "有人一直跟著我。\n先進店裡比較安全。", "pinyin": "Yǒurén yìzhí gēn zhe wǒ.\nXiān jìn diàn lǐ bǐjiào ānquán.", "jp": "誰かがずっと私について来ています。\nまずお店に入った方が安全です。", "category": "emergency"}, {"zh": "我頭很暈，需要坐一下。\n先休息，我去買水。", "pinyin": "Wǒ tóu hěn yūn, xūyào zuò yíxià.\nXiān xiūxí, wǒ qù mǎi shuǐ.", "jp": "頭がすごくふらふらします。少し座る必要があります。\n先に休んでいて。水を買ってくる。", "category": "emergency"}, {"zh": "如果變嚴重就直接去醫院。\n對，安全最重要。", "pinyin": "Rúguǒ biàn yánzhòng jiù zhíjiē qù yīyuàn.\nDuì, ānquán zuì zhòngyào.", "jp": "もしもっとひどくなったら、すぐ病院へ行きましょう。\nうん、安全が一番大事だね。", "category": "emergency"}]}
</script>

<script>
const DATA = JSON.parse(document.getElementById("embeddedData").textContent);
const WORDS = JSON.parse(document.getElementById("embeddedWords").textContent);

// ===== LingoFlow internal analytics Step 2 =====
// 外部送信なし。Console表示 + localStorage保存だけを行う。
let analyticsReady = false;
const ANALYTICS_STORAGE_KEY = "lingoflow_analytics_events_v1";
const ANALYTICS_MAX_EVENTS = 300;
const LINGOFLOW_APP_VERSION = "2026-05-23-word-card-v13-filtered-meta-selects-toggle-groups";
window.LINGOFLOW_APP_VERSION = LINGOFLOW_APP_VERSION;
function createAnalyticsSessionId(){
  return String(Date.now()) + "-" + Math.random().toString(36).slice(2, 8);
}
let ANALYTICS_SESSION_ID = createAnalyticsSessionId();
let analyticsSessionStartedAt = Date.now();
let analyticsSessionEndSent = false;

// ===== Anonymous user analytics v1 =====
// 個人情報を使わず、同じブラウザ内だけでDAU / Returning / Retentionを測る。
const ANALYTICS_USER_ID_KEY = "lingoflow_user_id_v1";
const ANALYTICS_FIRST_VISIT_KEY = "lingoflow_first_visit_date_v1";
const ANALYTICS_LAST_VISIT_KEY = "lingoflow_last_visit_date_v1";
const ANALYTICS_VISIT_DATES_KEY = "lingoflow_visit_dates_v1";

function getLocalDateString(date = new Date()){
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function dateDiffDays(fromDateString, toDateString){
  const from = new Date(`${fromDateString}T00:00:00`);
  const to = new Date(`${toDateString}T00:00:00`);
  return Math.floor((to - from) / 86400000);
}

function createAnonymousUserId(){
  try{
    if(window.crypto && typeof window.crypto.randomUUID === "function"){
      return "lf_" + window.crypto.randomUUID();
    }
  }catch(err){}
  return "lf_" + String(Date.now()) + "_" + Math.random().toString(36).slice(2, 12);
}

function getStoredUserId(){
  try{
    return localStorage.getItem(ANALYTICS_USER_ID_KEY) || "";
  }catch(err){
    return "";
  }
}

function getOrCreateUserId(){
  try{
    let userId = localStorage.getItem(ANALYTICS_USER_ID_KEY);
    if(!userId){
      userId = createAnonymousUserId();
      localStorage.setItem(ANALYTICS_USER_ID_KEY, userId);
    }
    return userId;
  }catch(err){
    return "";
  }
}

function getVisitDates(){
  try{
    const raw = JSON.parse(localStorage.getItem(ANALYTICS_VISIT_DATES_KEY) || "[]");
    return Array.isArray(raw) ? raw.filter(Boolean) : [];
  }catch(err){
    return [];
  }
}

function saveVisitDates(visitDates){
  try{
    const uniqueDates = Array.from(new Set(visitDates)).slice(-400);
    localStorage.setItem(ANALYTICS_VISIT_DATES_KEY, JSON.stringify(uniqueDates));
  }catch(err){}
}

function getAnalyticsEvents(){
  try{
    return JSON.parse(localStorage.getItem(ANALYTICS_STORAGE_KEY) || "[]");
  }catch(err){
    return [];
  }
}

function saveAnalyticsEvent(event){
  try{
    const events = getAnalyticsEvents();
    events.push(event);
    const trimmed = events.slice(-ANALYTICS_MAX_EVENTS);
    localStorage.setItem(ANALYTICS_STORAGE_KEY, JSON.stringify(trimmed));
  }catch(err){
    // localStorageが使えない環境でもアプリ本体は止めない。
  }
}

function getSessionDurationSec(){
  return Math.max(0, Math.round((Date.now() - analyticsSessionStartedAt) / 1000));
}

function startNewAnalyticsSession(reason){
  ANALYTICS_SESSION_ID = createAnalyticsSessionId();
  analyticsSessionStartedAt = Date.now();
  analyticsSessionEndSent = false;
  track("session_start", {
    reason,
    resumed_session: true
  });
}

function getCurrentPhraseContext(){
  try{
    const p = history[index] || null;
    return {
      phraseCategory: p ? p.category : null,
      phraseZhLength: p ? String(p.zh || "").length : 0
    };
  }catch(err){
    return {
      phraseCategory: null,
      phraseZhLength: 0
    };
  }
}

function clearAnalyticsEvents(){
  try{
    localStorage.removeItem(ANALYTICS_STORAGE_KEY);
    console.log("[LingoFlow Analytics] cleared");
  }catch(err){}
}

function track(name, data = {}){
  try{
    const event = {
      event: name,
      time: new Date().toISOString(),
      sessionId: ANALYTICS_SESSION_ID,
      userId: getStoredUserId() || undefined,
      appVersion: LINGOFLOW_APP_VERSION,
      localDate: getLocalDateString(),
      sessionDurationSec: getSessionDurationSec(),
      view: typeof view !== "undefined" ? view : undefined,
      mode: typeof mode !== "undefined" ? mode : undefined,
      level: typeof level !== "undefined" ? level : undefined,
      category: typeof category !== "undefined" ? category : undefined,
      index: typeof index !== "undefined" ? index : undefined,
      step: typeof step !== "undefined" ? step : undefined,
      ...getCurrentPhraseContext(),
      ...data
    };

    saveAnalyticsEvent(event);
    console.log("[LingoFlow Analytics]", event);

    fetch("https://lingoflow-analytics.hello-lingoflow.workers.dev/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(event),
      keepalive: true
    }).catch(() => {});
  }catch(err){}
}

function trackSessionEnd(reason){
  if(analyticsSessionEndSent) return;
  analyticsSessionEndSent = true;
  track("session_end", {
    reason,
    session_duration_sec: getSessionDurationSec(),
    duration_bucket:
      getSessionDurationSec() < 60 ? "under_1min" :
      getSessionDurationSec() < 180 ? "1_3min" :
      getSessionDurationSec() < 600 ? "3_10min" :
      getSessionDurationSec() < 1800 ? "10_30min" : "over_30min"
  });
}

// PC確認用: Consoleで getAnalyticsEvents() / clearAnalyticsEvents() が使える。
window.getAnalyticsEvents = getAnalyticsEvents;
window.clearAnalyticsEvents = clearAnalyticsEvents;

function initUserAnalytics(){
  try{
    const today = getLocalDateString();
    const userIdBefore = getStoredUserId();
    const userId = getOrCreateUserId();
    const isNewUser = !userIdBefore && !!userId;

    let firstVisitDate = localStorage.getItem(ANALYTICS_FIRST_VISIT_KEY);
    const lastVisitDate = localStorage.getItem(ANALYTICS_LAST_VISIT_KEY) || "";
    let visitDates = getVisitDates();

    if(!firstVisitDate){
      firstVisitDate = today;
      localStorage.setItem(ANALYTICS_FIRST_VISIT_KEY, firstVisitDate);
    }

    const isNewDailyVisit = !visitDates.includes(today);

    if(isNewUser){
      track("user_init", {
        user_id: userId,
        date: today,
        first_visit_date: firstVisitDate
      });
    }

    if(isNewDailyVisit){
      visitDates.push(today);
      saveVisitDates(visitDates);

      track("daily_active", {
        user_id: userId,
        date: today,
        first_visit_date: firstVisitDate,
        last_visit_date: lastVisitDate || null,
        visit_count: visitDates.length
      });

      if(visitDates.length >= 2){
        track("returning_user", {
          user_id: userId,
          date: today,
          first_visit_date: firstVisitDate,
          last_visit_date: lastVisitDate || null,
          visit_count: visitDates.length,
          days_since_first_visit: dateDiffDays(firstVisitDate, today)
        });
      }

      track("retention_check", {
        user_id: userId,
        date: today,
        first_visit_date: firstVisitDate,
        last_visit_date: lastVisitDate || null,
        visit_count: visitDates.length,
        days_since_first_visit: dateDiffDays(firstVisitDate, today)
      });
    }

    localStorage.setItem(ANALYTICS_LAST_VISIT_KEY, today);

    track("session_start", {
      user_id: userId,
      date: today,
      first_visit_date: firstVisitDate,
      last_visit_date: lastVisitDate || null,
      visit_count: visitDates.length,
      is_new_daily_visit: isNewDailyVisit
    });
  }catch(err){
    // ユーザー解析に失敗しても、学習アプリ本体は止めない。
  }
}

// PC確認用
window.getLingoFlowUserAnalytics = function(){
  return {
    userId: getStoredUserId(),
    firstVisitDate: localStorage.getItem(ANALYTICS_FIRST_VISIT_KEY),
    lastVisitDate: localStorage.getItem(ANALYTICS_LAST_VISIT_KEY),
    visitDates: getVisitDates(),
    appVersion: LINGOFLOW_APP_VERSION,
    sessionId: ANALYTICS_SESSION_ID,
    sessionDurationSec: getSessionDurationSec()
  };
};

const categoryNames = {
  all:"全部", greeting:"挨拶", cafe:"カフェ", restaurant:"食事", shopping:"買物",
  transport:"交通", hotel:"ホテル", tourism:"観光", daily:"日常", work:"仕事", emergency:"緊急"
};
const levelNames = { beginner:"初級", intermediate:"中級", advanced:"上級" };
const levels = ["beginner","intermediate","advanced"];
const views = ["question","list","word","player"];

let mode = "speaking";
let level = "beginner";
let view = "question";
let category = "all";
let step = 0;
let history = [];
let index = -1;
let autoId = 0;
let audioEnabled = false;
let sx = 0, sy = 0;
let currentListItems = [];
let wordIndex = 0;
let autoMode = "continuous";
let lastViewCycleAt = 0;
const VIEW_CYCLE_GUARD_MS = 450;


// ===== Speech error cleanup v3 =====
// speechSynthesis.cancel() による想定内の中断を audio_error として数えない。
// KPIでは本当のエラーだけ audio_error、ユーザー操作やタブ移動による停止は audio_interrupted に分ける。
let speechCancelExpectedUntil = 0;
let speechCancelExpectedReason = "";

function markExpectedSpeechCancel(reason = "cancel"){
  speechCancelExpectedUntil = Date.now() + 1200;
  speechCancelExpectedReason = reason;
}

function safeCancelSpeech(reason = "cancel"){
  try{
    markExpectedSpeechCancel(reason);
    speechSynthesis.cancel();
  }catch(err){}
}

function isExpectedSpeechError(e){
  const errorName = e && e.error ? String(e.error).toLowerCase() : "";
  return Date.now() < speechCancelExpectedUntil ||
    errorName === "interrupted" ||
    errorName === "canceled" ||
    errorName === "cancelled";
}

function handleSpeechError(e, audioType, text){
  const payload = {
    audioType,
    textLength: String(text ?? "").length,
    speechError: e && e.error ? String(e.error) : "unknown",
    cancelReason: speechCancelExpectedReason || null
  };

  if(isExpectedSpeechError(e)){
    track("audio_interrupted", payload);
  }else{
    track("audio_error", payload);
  }
}

const box = document.getElementById("box");
const listPanel = document.getElementById("listPanel");
const questionViewBtn = document.getElementById("questionViewBtn");
const listViewBtn = document.getElementById("listViewBtn");
const wordViewBtn = document.getElementById("wordViewBtn");
const playViewBtn = document.getElementById("playViewBtn");
const playerBottomBar = document.getElementById("playerBottomBar");
const modeBtn = document.getElementById("modeBtn");
const levelBtn = document.getElementById("levelBtn");
const categorySelect = document.getElementById("categorySelect");


// ===== Start overlay / audio permission: fixed version =====
// ページを開いた直後は必ず無音。ユーザーが「タップして開始」を押した後だけ音声を許可する。
const startOverlay = document.getElementById("startOverlay");
const startButton = document.getElementById("startButton");
const startCard = document.querySelector(".start-card");

audioEnabled = false;
let startUnlocked = false;

function unlockIOSAudio(){
  // iPhone Safari/Chrome 対策:
  // iOSは「ユーザーのタップ直後」に speechSynthesis.speak() しないと、
  // その後の音声再生をブロックすることがある。
  // ここで極短い日本語を一度だけ発話して音声エンジンを開く。
  try{
    if(!("speechSynthesis" in window)) return;

    safeCancelSpeech("unlock_before");
    speechSynthesis.getVoices();

    const u = new SpeechSynthesisUtterance("開始");
    u.lang = "ja-JP";
    u.volume = 0.01;
    u.rate = 1;
    u.pitch = 1;

    speechSynthesis.speak(u);

    // 発話キューだけ残る事故を避けるため少し後でキャンセル。
    // ユーザー操作直後の unlock は済んでいる。
    setTimeout(() => {
      safeCancelSpeech("unlock_cleanup");
    }, 220);

  }catch(err){}
}

function closeStartOverlay(){
  if(startUnlocked) return;
  startUnlocked = true;
  audioEnabled = true;

  track("start");

  unlockIOSAudio();

  const note = document.querySelector(".start-note");
  if(note){
    note.classList.add("audio-unlocked");
  }

  if(startOverlay){
    startOverlay.classList.add("hidden");
    startOverlay.style.display = "none";
    startOverlay.style.pointerEvents = "none";
  }
}

function handleStartTap(e){
  if(e){
    e.preventDefault();
    e.stopPropagation();
  }
  closeStartOverlay();
}

if(startOverlay){
  startOverlay.classList.remove("hidden");
  startOverlay.style.display = "flex";
  startOverlay.style.pointerEvents = "auto";
}

// スマホ対策:
// 一部ブラウザでは click が遅延/無効化されるため、複数イベントで開始を受ける。
// startUnlocked により二重実行は防止する。
[startButton, startCard, startOverlay].forEach(target => {
  if(!target) return;

  target.addEventListener("pointerup", handleStartTap, {capture:true});
  target.addEventListener("touchstart", handleStartTap, {capture:true, passive:false});
  target.addEventListener("touchend", handleStartTap, {capture:true, passive:false});
  target.addEventListener("click", handleStartTap, {capture:true});
});

function esc(s){
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
}
function stopAudio(){
  autoId++;
  try{
    speechSynthesis.pause();
    safeCancelSpeech("stop_playback");
  }catch(e){}
}

function showStartOverlay(){
  if(startOverlay){
    startOverlay.classList.remove("hidden");
    startOverlay.style.display = "flex";
  }
}

function stopAllPlayback(){
  // スリープ・別タブ移動では「音声と連続再生ループ」だけ止める。
  // audioEnabled は false にしない。false にすると復帰後に連続再生を再開できなくなる。
  autoId++;
  try{
    speechSynthesis.pause();
    safeCancelSpeech("stop_playback");
  }catch(e){}
}

document.addEventListener("visibilitychange", function(){
  if(document.hidden){
    track("visibility_hidden", { reason: "visibility_hidden" });
    track("sleep", { reason: "visibility_hidden" });
    trackSessionEnd("visibility_hidden");
    stopAllPlayback();
  }else{
    const wasSessionEnded = analyticsSessionEndSent;
    if(wasSessionEnded){
      startNewAnalyticsSession("visibility_visible");
    }
    track("visibility_visible", { reason: "visibility_visible" });
    track("resume", { reason: "visibility_visible" });
  }
});

window.addEventListener("pagehide", function(){
  track("sleep", { reason: "pagehide" });
  trackSessionEnd("pagehide");
  stopAllPlayback();
});
window.addEventListener("beforeunload", function(){
  trackSessionEnd("beforeunload");
});
window.addEventListener("blur", function(){
  track("sleep", { reason: "window_blur" });
  stopAllPlayback();
});

// 復帰時に自動再生はしない。再開はユーザーのタップ操作だけで行う。
function getList(){
  let list = (DATA[level] || []).filter(p => category === "all" || p.category === category);
  return list.length ? list : (DATA[level] || []);
}
function pick(){
  const list = getList();
  return list[Math.floor(Math.random() * list.length)];
}

  return icons[name] || '';

function controlMarkup(icon, label){
  return esc(label);
}
function categoryLabel(cat){ return categoryNames[cat] || categoryNames.all || "全部"; }
function currentListCount(){ return getList().length || 1; }
function progressPercent(){

function estimate(text){
  const clean = String(text).replace(/\s/g,"");
  let weight = 0;
  for (const ch of clean){
    weight += 1;
    if("，。！？,.!?".includes(ch)) weight += 1.6;
    if("啊吧嗎呢啦喔".includes(ch)) weight += 0.8;
  }
  return Math.max(2200, weight * 200);
}
async function highlightElement(text, rootEl){
  if(!audioEnabled) return;
  safeCancelSpeech("before_highlight_speak");

  rootEl.innerHTML = renderChars(text);
  const total = Array.from(String(text ?? "")).length;
  const duration = estimate(text);
  const chars = rootEl.querySelectorAll(".char");
  const charsArray = Array.from(chars);

  let ended = false;
  let last = -1;

  const markUntil = (i) => {
    chars.forEach(span => {
      if(Number(span.dataset.i) <= i){
        span.classList.add("done");
        span.style.setProperty("color", "#007aff", "important");
        span.style.setProperty("text-shadow", "0 0 8px rgba(0,122,255,.24)", "important");
      }
    });
  };
  const markAll = () => chars.forEach(span => {
    span.classList.add("done");
    span.style.setProperty("color", "#007aff", "important");
    span.style.setProperty("text-shadow", "0 0 8px rgba(0,122,255,.24)", "important");
  });

  // 同期開始の可視確認。クリック直後に先頭文字を必ず青くする。
  markUntil(0);

  const u = new SpeechSynthesisUtterance(String(text).replace(/\n/g,"。"));
  u.lang = "zh-TW";
  u.rate = 1.0;
  u.pitch = 1.02;
  const voices = speechSynthesis.getVoices();
  const v = voices.find(x => x.lang === "zh-TW" || x.name.toLowerCase().includes("taiwan") || x.name.includes("臺灣") || x.name.includes("台湾"));
  if(v) u.voice = v;

  u.onend = () => {
    ended = true;
    markAll();
    track("audio_complete", { audioType: "highlight", textLength: String(text ?? "").length });
  };
  u.onerror = (e) => {
    ended = true;
    markAll();
    handleSpeechError(e, "highlight", text);
  };

  if(!audioEnabled){
    ended = true;
    return;
  }

  track("play_audio", { audioType: "highlight", textLength: String(text ?? "").length });
  speechSynthesis.speak(u);

  const start = performance.now();
  const delay = 220;

  while(!ended && audioEnabled){
    await wait(100);
    if(!audioEnabled) break;
    const elapsed = Math.max(0, performance.now() - start - delay);
    const progress = Math.min(0.96, elapsed / duration);
    let weightedTotal = 0;
    const weights = charsArray.map(ch => {
      const t = ch.textContent || "";
      let w = 1;
      if("，。！？,.!?".includes(t)) w += 1.6;
      if("啊吧嗎呢啦喔".includes(t)) w += 0.8;
      weightedTotal += w;
      return w;
    });

    const targetWeight = progress * weightedTotal;
    let acc = 0;
    let i = 0;
    for(let k=0; k<weights.length; k++){
      acc += weights[k];
      if(acc >= targetWeight){
        i = k;
        break;
      }
    }
    if(i > last){
      last = i;
      markUntil(i);
    }
  }
}

async function startAuto(){

    const p = history[index] || pick();
    if(!p) break;

    step = 2;
    renderAuto(p);

    // 連続再生・ランダム再生だけ:
    // 中国語を読み上げた後、日本語訳を自動で読み上げる。
    // 問題モード・一覧クリックでは日本語読み上げを入れない。
    await speakHighlight(p.zh);

    if(!canContinueAuto(id)) break;

    await wait(550);

    if(!canContinueAuto(id)) break;

    await speakJapanese(p.jp);

    if(!canContinueAuto(id)) break;

    await wait(900);

    if(!canContinueAuto(id)) break;

    const next = pick();
    if(!next) break;

    history.push(next);
    index = history.length - 1;
  }
}

    if(has) out += html;
  });

  listPanel.innerHTML = out;
}

// ===== Word card v8 behavior patch =====
// This patch is intentionally appended after the original boot code.
// It overrides only UI routing/rendering while preserving the audio safety controls.
let contentMode = "sentence";       // sentence | word
let wordQuestionMode = "emoji";     // emoji | zhpinyin
let wordQuestionRevealed = false;

const contentBottomBar = document.getElementById("contentBottomBar");
const wordQuestionModeBar = document.getElementById("wordQuestionModeBar");
const sentenceContentBtn = document.getElementById("sentenceContentBtn");
const wordContentBtn = document.getElementById("wordContentBtn");
const wordQuestionEmojiBtn = document.getElementById("wordQuestionEmojiBtn");
const wordQuestionZhpinyinBtn = document.getElementById("wordQuestionZhpinyinBtn");

function setBtnActive(btn, active){
  if(!btn) return;
  btn.classList.toggle("active", !!active);
  btn.setAttribute("aria-pressed", active ? "true" : "false");
}
function isSentenceWordToggleView(){
  return view === "question" || view === "list" || view === "player" || view === "continuous" || view === "random";
}
function syncContentBottomBars(){
  const showContent = isSentenceWordToggleView();
  if(contentBottomBar){
    contentBottomBar.classList.toggle("hidden-panel", !showContent);
    setBtnActive(sentenceContentBtn, contentMode === "sentence");
    setBtnActive(wordContentBtn, contentMode === "word");
  }
  const showWordQuestion = view === "question" && contentMode === "word";
  if(wordQuestionModeBar){
    wordQuestionModeBar.classList.toggle("hidden-panel", !showWordQuestion);
    setBtnActive(wordQuestionEmojiBtn, wordQuestionMode === "emoji");
    setBtnActive(wordQuestionZhpinyinBtn, wordQuestionMode === "zhpinyin");
  }
  document.body.classList.toggle("is-content-toggle-visible", showContent);
  document.body.classList.toggle("is-word-question-controls-visible", showWordQuestion);
}

syncPlayerBottomBar = function(){
  const show = view === "player" || view === "continuous" || view === "random";
  if(playerBottomBar){
    playerBottomBar.classList.toggle("hidden-panel", !show);
    playerBottomBar.querySelectorAll("[data-player-control]").forEach(btn => {
      const action = btn.getAttribute("data-player-control");
      const active = (action === "continuous" && autoMode === "continuous") || (action === "random" && autoMode === "random");
      btn.classList.toggle("active", active);
      btn.setAttribute("aria-pressed", active ? "true" : "false");
    });
  }
  document.body.classList.toggle("is-player-controls-visible", show);
  syncContentBottomBars();
};

updateButtons = function(){
  modeBtn.textContent = mode === "speaking" ? "話す" : "読む";
  levelBtn.textContent = levelNames[level];
  setActiveButton(questionViewBtn, view === "question");
  setActiveButton(listViewBtn, view === "list");
  setActiveButton(wordViewBtn, view === "word");
  setActiveButton(playViewBtn, view === "player" || view === "continuous" || view === "random");
  modeBtn.setAttribute("aria-label", `学習順序: ${mode === "speaking" ? "話す" : "読む"}`);
  levelBtn.setAttribute("aria-label", `レベル: ${levelNames[level]}`);
  syncPlayerBottomBar();
};

function switchContentMode(next){
  if(next !== "sentence" && next !== "word") return;
  if(contentMode === next) return;
  stopAudio();
  contentMode = next;
  wordQuestionRevealed = false;
  step = 0;
  history = [];
  index = -1;
  track("content_mode_change", { contentMode });
  updateButtons();
  if(view === "list") renderList();
  else if(view === "player") renderPlaybackPanel();
  else if(view === "continuous" || view === "random") startAuto();
  else if(view === "question") renderQuestion();
}
function switchWordQuestionMode(next){
  if(next !== "emoji" && next !== "zhpinyin") return;
  stopAudio();
  wordQuestionMode = next;
  wordQuestionRevealed = false;
  track("word_question_mode_change", { wordQuestionMode });
  updateButtons();
  if(view === "question" && contentMode === "word") renderQuestion();
}

function pickWord(){
  const list = getWordList();
  return list[Math.floor(Math.random() * list.length)] || null;
}
function currentWordQuestion(){
  return currentWord();
}
function nextWordQuestion(){
  stopAudio();
  wordIndex = normalizeWordIndex(wordIndex + 1);
  wordQuestionRevealed = false;
  renderQuestion();
  const w = currentWordQuestion();
  track("word_question_next", { wordCategory: w?.category || null, wordId: w?.id || null, wordQuestionMode });
}
function prevWordQuestion(){
  stopAudio();
  wordIndex = normalizeWordIndex(wordIndex - 1);
  wordQuestionRevealed = false;
  renderQuestion();
  const w = currentWordQuestion();
  track("word_question_prev", { wordCategory: w?.category || null, wordId: w?.id || null, wordQuestionMode });
}
function revealWordQuestion(){
  wordQuestionRevealed = true;
  renderQuestion();
}
function renderWordQuestion(){
  const w = currentWordQuestion();
  if(!w){
    box.innerHTML = '<div class="error">表示できる単語データがありません。</div>';
    return;
  }
  const prompt = wordQuestionMode === "emoji"
    ? `<div class="word-emoji" aria-label="イラスト">${esc(w.emoji || "🔤")}</div>`
    : `<div><div class="word-zh">${esc(w.zh)}</div><div class="word-pinyin">${esc(w.pinyin)}</div></div>`;
  const answer = wordQuestionRevealed ? `
    <div class="word-question-answer">
      <div class="word-wrap">
        <div class="word-emoji" aria-hidden="true">${esc(w.emoji || "🔤")}</div>
        <div class="word-zh">${esc(w.zh)}</div>
        <div class="word-pinyin">${esc(w.pinyin)}</div>
        <div class="word-jp">${esc(w.jp)}</div>
      </div>
    </div>` : `<div class="word-question-hidden-note">カードをタップすると答えを表示します。</div>`;
  box.innerHTML = `
    <div class="question-card-top">
      <div class="meta-left">
        <span class="chip">問題</span>
        <span class="chip">${esc(categoryLabel(w.category))}</span>
      </div>
      <div class="counter">${wordIndex + 1} / ${currentWordCount()}</div>
    </div>
    <div class="word-question-prompt">
      <div class="word-wrap">${prompt}${answer}</div>
    </div>
    <div class="status">単語問題：${wordQuestionMode === "emoji" ? "イラストのみ" : "中国語＋ピンイン"}</div>
    <div class="question-nav" aria-label="単語問題操作">
      <button type="button" data-qnav="prev">← 前</button>
      <button type="button" data-qnav="replay">▶ 聞く</button>
      <button type="button" data-qnav="next">次 →</button>
    </div>
  `;
}

setView = function(v){
  stopAudio();
  view = v;
  updateButtons();

  if(view === "list"){
    box.classList.add("hidden-panel");
    listPanel.classList.remove("hidden-panel");
    renderList();
    return;
  }

  showBoxOnly();

  if(view === "word"){
    if(level !== "beginner") level = "beginner";
    wordIndex = normalizeWordIndex(wordIndex);
    updateButtons();
    renderWord();
    track("word_view", { wordCategory: currentWord()?.category || null, wordId: currentWord()?.id || null });
    return;
  }

  if(view === "player"){
    renderPlaybackPanel();
    return;
  }

  if(view === "continuous" || view === "random"){
    autoMode = view;
    if(contentMode === "word"){
      wordIndex = normalizeWordIndex(wordIndex);
      startAuto();
    }else{
      nextQuestion(true);
      startAuto();
    }
  }else{
    if(contentMode === "word"){
      wordQuestionRevealed = false;
      renderQuestion();
    }else{
      if(!history[index]) nextQuestion(true);
      else renderQuestion();
    }
  }
};

cycleMode = function(){
  stopAudio();
  mode = mode === "speaking" ? "reading" : "speaking";
  step = 0;
  wordQuestionRevealed = false;
  track("mode_change", { mode });
  updateButtons();

  if(view === "list") renderList();
  else if(view === "word") renderWord();
  else if(view === "player") renderPlaybackPanel();
  else if(view === "continuous" || view === "random") startAuto();
  else renderQuestion();
};

cycleLevel = function(){
  stopAudio();
  level = levels[(levels.indexOf(level)+1) % levels.length];
  step = 0; history = []; index = -1;
  if(view === "word" || contentMode === "word") level = "beginner";
  wordQuestionRevealed = false;
  track("level_change", { level });
  updateButtons();
  if(view === "list") renderList();
  else if(view === "word"){ wordIndex = 0; renderWord(); }
  else if(view === "player") renderPlaybackPanel();
  else if(view === "continuous" || view === "random") startAuto();
  else renderQuestion();
};

setCategory = function(c){
  stopAudio();
  category = c;
  step = 0; history = []; index = -1; wordIndex = 0; wordQuestionRevealed = false;
  track("category_change", { category });
  updateButtons();
  if(view === "list") renderList();
  else if(view === "word") renderWord();
  else if(view === "player") renderPlaybackPanel();
  else if(view === "continuous" || view === "random") startAuto();
  else renderQuestion();
};

nextStep = function(){
  if(view === "word" || view === "player") return;

  if(view === "continuous" || view === "random"){
    startAuto();
    return;
  }

  if(contentMode === "word" && view === "question"){
    if(!wordQuestionRevealed){ revealWordQuestion(); return; }
    nextWordQuestion();
    return;
  }

  if(!history[index]) return;

  if(step < 2){
    step++;
    renderQuestion();
    return;
  }
  nextQuestion(true);
};

renderQuestion = function(options = {}){
  if(contentMode === "word"){
    renderWordQuestion();
    return;
  }

  const p = history[index];
  if(!p) return;

  const order = mode === "speaking" ? ["jp","zh","pinyin"] : ["zh","pinyin","jp"];
  const visible = step + 1;
  const shouldSpeakZh = !options.suppressAutoSpeak && ((mode === "reading" && step === 1) || (mode === "speaking" && step === 2));

  const linesHtml = order.map((key,i) => {
    const isVisible = i < visible;
    const content = key === "zh" && isVisible && shouldSpeakZh ? renderChars(p.zh) : esc(p[key]);
    return `<div class="line ${isVisible ? "" : "hidden-line"}"><div class="${key}">${content}</div></div>`;
  }).join("");

  const statusText = step < 2 ? "カードをタップすると次を表示します。" : "カードをタップすると次の問題へ進みます。";

  box.innerHTML = `
    <div class="question-card-top">
      <div class="meta-left">
        <span class="chip">問題</span>
        <span class="chip">${esc(categoryLabel(p.category))}</span>
      </div>
      <div class="counter">${Math.max(index,0) + 1} / ${currentListCount()}</div>
    </div>
    <div class="card-main"><div class="lines-wrap">${linesHtml}</div></div>
    <div class="status">${statusText}</div>
    <div class="question-nav" aria-label="問題操作">
      <button type="button" data-qnav="prev">← 前</button>
      <button type="button" data-qnav="replay">↻ もう一度</button>
      <button type="button" data-qnav="next">次 →</button>
    </div>
  `;
  if(shouldSpeakZh) speakHighlight(p.zh);
};

replayCurrentQuestion = function(){
  if(contentMode === "word" && view === "question"){
    const w = currentWordQuestion();
    if(!w) return;
    track("word_question_replay_audio", { wordCategory: w.category || null, wordId: w.id || null, wordQuestionMode });
    speakWordAudio(w.zh);
    return;
  }
  const p = history[index];
  if(!p) return;
  step = 2;
  renderQuestion({ suppressAutoSpeak: true });
  track("question_replay", { phraseCategory: p.category || null });
  speakHighlight(p.zh);
};

goPrevQuestion = function(){
  if(contentMode === "word" && view === "question"){
    prevWordQuestion();
    return;
  }
  const before = index;
  prevQuestion();
  if(index !== before) track("question_prev", { index });
};

goNextQuestion = function(){
  if(contentMode === "word" && view === "question"){
    nextWordQuestion();
    return;
  }
  nextQuestion(false);
  track("question_next_manual", { index });
};

renderWord = function(){

function listHeaderHtml(cat, lv, labelSuffix = ""){
  return `<div class="list-group-head">
    <div class="list-genre-block"><span class="list-head-label">ジャンル</span><span class="list-head-genre">${esc(categoryLabel(cat))}</span></div>
    <div class="list-level-block"><span class="list-head-label">レベル</span><span class="list-head-level">${esc(levelNames[lv] || lv)}${labelSuffix}</span></div>
  </div>`;
}

function renderSentenceList(){
  currentListItems = [];
  let out = `<div class="list-status">文章一覧：タップすると音声に合わせて中国語だけ青色に進みます</div>`;
  Object.keys(categoryNames).filter(c => c !== "all").forEach(cat => {
    levels.forEach(lv => {
      const list = (DATA[lv] || []).filter(p => p.category === cat);
      if(!list.length) return;

function renderWordList(){

  Object.keys(categoryNames).filter(c => c !== "all").forEach(cat => {

    if(!list.length) return;

    list.forEach(w => {

      currentListItems.push({type:"word", ...w});
      out += `<div class="list-item" data-id="${id}">

          <div class="word-list-emoji" aria-hidden="true">${esc(w.emoji || "🔤")}</div>

            <div class="list-zh">${esc(w.zh)}</div>

renderList = function(){

playListById = async function(id){
  stopAudio();
  const item = currentListItems[Number(id)];
  const el = listPanel.querySelector(`.list-item[data-id="${id}"]`);
  const zhEl = el ? el.querySelector(".list-zh") : null;
  if(!item || !zhEl){ alert("一覧再生エラー: item not found"); return; }
  resetAllListVisuals();
  el.classList.add("playing");
  if(item.type === "word"){
    await speakWordAudio(item.zh);
    if(el.classList.contains("playing")) resetListItemVisual(el);
    return;
  }
  await highlightElement(item.zh, zhEl);
  if(el.classList.contains("playing")) resetListItemVisual(el);
};

renderPlaybackPanel = function(){

  `;

function renderWordAuto(w){
  const autoLabel = view === "random" ? "ランダム" : "連続";
  box.innerHTML = `
    <div class="auto-card-top">
      <div class="meta-left"><span class="chip">${autoLabel}</span><span class="chip">${esc(categoryLabel(w.category))}</span></div>
      <div class="counter">${wordIndex + 1} / ${currentWordCount()}</div>
    </div>
    <div class="word-card-main">
      <div class="word-wrap">
        <div class="word-emoji" aria-hidden="true">${esc(w.emoji || "🔤")}</div>
        <div class="word-zh">${esc(w.zh)}</div>
        <div class="word-pinyin">${esc(w.pinyin)}</div>
        <div class="word-jp">${esc(w.jp)}</div>
      </div>
    </div>
    <div class="status">単語音声のみ：台湾華語 → 次の単語</div>
  `;
}

canContinueAuto = function(id){
  return id === autoId && audioEnabled && (view === "continuous" || view === "random");
};

startAuto = async function(){
  if(!audioEnabled) return;
  const id = ++autoId;

  while(canContinueAuto(id)){
    if(contentMode === "word"){
      const w = autoMode === "random" ? pickWord() : currentWord();
      if(!w) break;
      if(autoMode === "random"){
        const list = getWordList();
        const pos = list.findIndex(x => x.id === w.id);
        if(pos >= 0) wordIndex = pos;
      }
      renderWordAuto(w);
      await speakWordAudio(w.zh);
      if(!canContinueAuto(id)) break;
      await wait(700);
      if(!canContinueAuto(id)) break;
      if(autoMode === "continuous") wordIndex = normalizeWordIndex(wordIndex + 1);
      continue;
    }

    const p = history[index] || pick();
    if(!p) break;
    step = 2;
    renderAuto(p);
    await speakHighlight(p.zh);
    if(!canContinueAuto(id)) break;
    await wait(550);
    if(!canContinueAuto(id)) break;
    await speakJapanese(p.jp);
    if(!canContinueAuto(id)) break;
    await wait(900);
    if(!canContinueAuto(id)) break;
    const next = pick();
    if(!next) break;
    history.push(next);
    index = history.length - 1;
  }
};

  function directionLabel(){ return mode === 'speaking' ? '日→中' : '中→日'; }
  function contentLabel(){
    if(view === 'question' && contentMode === 'word' && wordQuestionMode === 'emoji') return 'イラスト';
    return contentMode === 'word' ? '単語' : '文章';
  }
  function runLabel(){ return (view === 'continuous' || view === 'random') ? '停止' : '再生'; }
  function orderLabel(){ return autoMode === 'random' ? 'ランダム' : '連続'; }
  function btn(label, attrs, active, group){ return `<button type="button" ${attrs} data-group="${group||''}" class="${active?'active':''}" aria-pressed="${active?'true':'false'}">${esc(label)}</button>`; }
  function cycleContent(){
    stopAudio();
    if(view === 'question'){
      if(contentMode === 'sentence'){ contentMode='word'; wordQuestionMode='zhpinyin'; }
      else if(wordQuestionMode === 'zhpinyin'){ contentMode='word'; wordQuestionMode='emoji'; }
      else { contentMode='sentence'; wordQuestionMode='zhpinyin'; }
      wordQuestionRevealed=false; step=0; history=[]; index=-1;
      track('content_mode_change', {contentMode, wordQuestionMode, source:'v12_cycle_content'});
      updateButtons(); renderQuestion(); return;
    }
    switchContentMode(contentMode === 'word' ? 'sentence' : 'word');
  }
  function toggleRun(){ if(view === 'continuous' || view === 'random') stopPlaybackManual(); else startOrResumePlayback(); }
  function toggleOrder(){
    const next = autoMode === 'random' ? 'continuous' : 'random';
    autoMode = next;
    track('play_mode_select', { playMode: next, source:'v12_toggle' });
    if(view === 'continuous' || view === 'random') setAutoPlayback(next);
    else{ updateButtons(); if(view === 'player') renderPlaybackPanel(); }
  }
  function toggleDirection(){ cycleMode(); }

  window.renderUnifiedBottomActionBar = function(){
    ensureV12MetaSelectors();
    if(!bottomActionBar) return;
    if(contentBottomBar) contentBottomBar.classList.add('hidden-panel');
    if(wordQuestionModeBar) wordQuestionModeBar.classList.add('hidden-panel');
    if(playerBottomBar) playerBottomBar.classList.add('hidden-panel');
    const buttons=[];
    const inPlayer = view === 'player' || view === 'continuous' || view === 'random';
    if(view === 'question' || view === 'list'){
      buttons.push(btn(contentLabel(), 'data-v12-toggle="content"', true, 'content'));
      buttons.push(btn(directionLabel(), 'data-v12-toggle="direction"', true, 'direction'));
    }else if(inPlayer){
      buttons.push(btn(contentLabel() === 'イラスト' ? '単語' : contentLabel(), 'data-v12-toggle="content"', true, 'content'));
      buttons.push(btn(runLabel(), 'data-v12-toggle="run"', view === 'continuous' || view === 'random', 'run'));
      buttons.push(btn(orderLabel(), 'data-v12-toggle="order"', true, 'order'));
      buttons.push(btn(directionLabel(), 'data-v12-toggle="direction"', true, 'direction'));
    }
    bottomActionBar.className='bottom-action-bar hidden-panel';
    if(buttons.length){ bottomActionBar.className=`bottom-action-bar v12-action-bar v12-count-${buttons.length}`; bottomActionBar.innerHTML=buttons.join(''); }
    else bottomActionBar.innerHTML='';
    document.body.classList.toggle('is-bottom-action-visible', buttons.length>0);
    document.body.classList.toggle('is-content-toggle-visible', false);
    document.body.classList.toggle('is-word-question-controls-visible', false);
    document.body.classList.toggle('is-player-controls-visible', inPlayer);
  };
  if(bottomActionBar && !bottomActionBar.dataset.v12Bound){
    bottomActionBar.dataset.v12Bound='1';
    bottomActionBar.addEventListener('click', function(e){
      const b=e.target.closest('[data-v12-toggle]');
      if(!b || !bottomActionBar.contains(b)) return;
      e.preventDefault(); e.stopPropagation();
      const a=b.getAttribute('data-v12-toggle');
      if(a==='content') cycleContent();
      else if(a==='run') toggleRun();
      else if(a==='order') toggleOrder();
      else if(a==='direction') toggleDirection();
    }, true);
  }
  window.cycleView = function(){
    const now=Date.now(); if(now-lastViewCycleAt<VIEW_CYCLE_GUARD_MS) return; lastViewCycleAt=now;
    const simpleViews=['player','question','list'];
    const normalized=(view==='continuous'||view==='random'||view==='word')?'player':view;
    const nextView=simpleViews[(Math.max(0,simpleViews.indexOf(normalized))+1)%simpleViews.length];
    track('view_change',{from:view,to:nextView,source:'v12_top_order'}); setView(nextView);
  };
  window.updateButtons = function(){
    ensureV12MetaSelectors();
    const lv=document.getElementById('v12LevelSelect'); if(lv) lv.value=level;
    if(categorySelect){ categorySelect.value=category; const allOpt=categorySelect.querySelector('option[value="all"]'); if(allOpt) allOpt.textContent='ジャンル'; }
    setActiveButton(playViewBtn, view==='player'||view==='continuous'||view==='random');
    setActiveButton(questionViewBtn, view==='question');
    setActiveButton(listViewBtn, view==='list');
    setActiveButton(wordViewBtn, false);
    renderUnifiedBottomActionBar();
  };
  window.renderPlaybackPanel = function(){
    const contentLabel = contentMode === 'word' ? '単語' : '文章';
    box.innerHTML = `<div class="player-main"><div class="player-wrap"><div class="player-title">${contentLabel}再生モード</div><p class="player-desc">下側の4つの切替で、内容・再生状態・順番・表示順を選びます。</p></div></div><div class="status">自動再生はこの画面で選んだ時だけ開始します。</div>`;
  };
  ensureV12MetaSelectors(); updateButtons(); if(view==='word') view='question'; setView(view);
})();

  function selectedCategories(){
