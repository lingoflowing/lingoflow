<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LingoFlow</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app" aria-label="LingoFlow">
  <section class="card" aria-live="polite">
    <img id="photo" class="photo" src="images/morning.jpg" alt="LingoFlow scene">
<div class="sentence-block">
        <div id="sentenceZh" class="sentence-zh"></div>
        <div id="sentencePinyin" class="pinyin"></div>
        <div id="sentenceJa" class="ja"></div>
      </div>
    </div>

    <button id="playStopButton" class="play-stop-button" type="button" aria-label="再生">
      <span id="playStopIcon" class="play-stop-icon" aria-hidden="true"></span>
    </button>
  </section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
