/* ===== v15 reflected JS patch: labels/order + paired toggles ===== */
(function(){
  const V15_VERSION = "2026-05-23-v18-detached-bottom-groups";
  try{
    document.body.setAttribute('data-lingoflow-v15', V15_VERSION);
    const meta = document.querySelector('meta[name="lingoflow-app-version"]');
    if(meta) meta.setAttribute('content', V15_VERSION);
  }catch(e){}

  function setTopLabelsV15(){
    try{
      if(playViewBtn) playViewBtn.textContent = '聞く';
      if(listViewBtn) listViewBtn.textContent = '読む';
      if(questionViewBtn) questionViewBtn.textContent = 'クイズ';
      if(wordViewBtn){ wordViewBtn.hidden = true; wordViewBtn.setAttribute('aria-hidden','true'); wordViewBtn.tabIndex = -1; }
    }catch(e){}
  }

  function isAutoPlayingV15(){ return view === 'continuous' || view === 'random'; }
  function activeDirectionV15(){ return mode === 'speaking' ? 'jpzh' : 'zhjp'; }
  function activeContentV15(){ return contentMode === 'word' ? 'word' : 'sentence'; }
  function activeOrderV15(){ return autoMode === 'random' ? 'random' : 'continuous'; }
  function groupV15(name, buttons){
    return `<div class="v15-toggle-group" data-v15-group="${name}">${buttons.join('')}</div>`;
  }
  function buttonV15(label, group, value, active){
    return `<button type="button" data-v15-toggle="${group}" data-v15-value="${value}" class="${active ? 'active' : ''}" aria-pressed="${active ? 'true' : 'false'}">${esc(label)}</button>`;
  }
  function rerenderV15(){
    updateButtons();
    if(view === 'list') renderList();
    else if(view === 'player') renderPlaybackPanel();
    else if(view === 'question') renderQuestion();
  }
  function setContentV15(next){
    stopAudio();
    contentMode = next === 'word' ? 'word' : 'sentence';
    if(contentMode === 'word' && view === 'question' && !wordQuestionMode) wordQuestionMode = 'zhpinyin';
    wordQuestionRevealed = false;
    step = 0; history = []; index = -1;
    track('content_mode_change', {contentMode, source:'v15_pair_toggle'});
    rerenderV15();
  }
  function setRunV15(next){
    if(next === 'stop'){
      stopPlaybackManual();
      updateButtons();
      return;
    }
    if(view !== 'continuous' && view !== 'random'){
      setView(autoMode === 'random' ? 'random' : 'continuous');
    }else{
      startOrResumePlayback();
    }
  }
  function setOrderV15(next){
    autoMode = next === 'random' ? 'random' : 'continuous';
    track('play_mode_select', {playMode:autoMode, source:'v15_pair_toggle'});
    if(isAutoPlayingV15()) setAutoPlayback(autoMode);
    else updateButtons();
  }
  function setDirectionV15(next){
    stopAudio();
    mode = next === 'jpzh' ? 'speaking' : 'reading';
    step = 0;
    track('mode_change', {mode, source:'v15_pair_toggle'});
    rerenderV15();
  }

  window.renderUnifiedBottomActionBar = function(){
    setTopLabelsV15();
    if(!bottomActionBar) return;
    if(contentBottomBar) contentBottomBar.classList.add('hidden-panel');
    if(wordQuestionModeBar) wordQuestionModeBar.classList.add('hidden-panel');
    if(playerBottomBar) playerBottomBar.classList.add('hidden-panel');

    const c = activeContentV15();
    const r = isAutoPlayingV15() ? 'play' : 'stop';
    const o = activeOrderV15();
    const d = activeDirectionV15();
    const html = [
      groupV15('content', [
        buttonV15('文章','content','sentence', c === 'sentence'),
        buttonV15('単語','content','word', c === 'word')
      ]),
      groupV15('run', [
        buttonV15('再生中','run','play', r === 'play'),
        buttonV15('停止','run','stop', r === 'stop')
      ]),
      groupV15('order', [
        buttonV15('連続','order','continuous', o === 'continuous'),
        buttonV15('ランダム','order','random', o === 'random')
      ]),
      groupV15('direction', [
        buttonV15('中→日','direction','zhjp', d === 'zhjp'),
        buttonV15('日→中','direction','jpzh', d === 'jpzh')
      ])
    ].join('');
    bottomActionBar.className = 'bottom-action-bar v15-action-bar';
    bottomActionBar.innerHTML = html;
    document.body.classList.add('is-bottom-action-visible');
    document.body.classList.remove('is-content-toggle-visible','is-word-question-controls-visible');
    document.body.classList.toggle('is-player-controls-visible', isAutoPlayingV15());
  };

  if(bottomActionBar && !bottomActionBar.dataset.v15Bound){
    bottomActionBar.dataset.v15Bound = '1';
    bottomActionBar.addEventListener('click', function(e){
      const b = e.target.closest('[data-v15-toggle]');
      if(!b || !bottomActionBar.contains(b)) return;
      e.preventDefault();
      e.stopPropagation();
      const group = b.getAttribute('data-v15-toggle');
      const value = b.getAttribute('data-v15-value');
      if(group === 'content') setContentV15(value);
      else if(group === 'run') setRunV15(value);
      else if(group === 'order') setOrderV15(value);
      else if(group === 'direction') setDirectionV15(value);
    }, true);
  }

  const prevUpdateButtonsV15 = window.updateButtons;
  window.updateButtons = function(){
    if(typeof prevUpdateButtonsV15 === 'function') prevUpdateButtonsV15();
    setTopLabelsV15();
    setActiveButton(playViewBtn, view === 'player' || view === 'continuous' || view === 'random');
    setActiveButton(listViewBtn, view === 'list');
    setActiveButton(questionViewBtn, view === 'question');
    setActiveButton(wordViewBtn, false);
    if(window.renderUnifiedBottomActionBar && !window.__v15RenderingBottom){
      window.__v15RenderingBottom = true;
      try{ window.renderUnifiedBottomActionBar(); }finally{ window.__v15RenderingBottom = false; }
    }
  };

  window.cycleView = function(){
    const now = Date.now();
    if(now - lastViewCycleAt < VIEW_CYCLE_GUARD_MS) return;
    lastViewCycleAt = now;
    const simpleViews = ['player','list','question'];
    const normalized = (view === 'continuous' || view === 'random' || view === 'word') ? 'player' : view;
    const nextView = simpleViews[(Math.max(0, simpleViews.indexOf(normalized)) + 1) % simpleViews.length];
    track('view_change', {from:view, to:nextView, source:'v15_top_order'});
    setView(nextView);
  };

  setTopLabelsV15();
  updateButtons();
})();

</script>

<script>
(function(){
  'use strict';
  const VERSION = '2026-05-23-v18-detached-bottom-groups';

  const icons = {
    hear:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13v-2a8 8 0 0 1 16 0v2"/><path d="M4 13h3v6H5a1 1 0 0 1-1-1v-5Z"/><path d="M20 13h-3v6h2a1 1 0 0 0 1-1v-5Z"/></svg>',
    read:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 4H11v15H7.5A3.5 3.5 0 0 0 4 20.5v-15Z"/><path d="M20 5.5A3.5 3.5 0 0 0 16.5 4H13v15h3.5A3.5 3.5 0 0 1 20 20.5v-15Z"/></svg>',
    quiz:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.6 2.6 0 1 1 4.4 1.9c-.9.7-1.7 1.2-1.7 2.6"/><path d="M12 17.2h.01"/></svg>',
    level:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11"/><path d="M12 19V7"/><path d="M19 19V4"/></svg>',
    tag:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13 13 20 4 11V4h7l9 9Z"/><path d="M8 8h.01"/></svg>'
  };

  function setTab(btn, icon, label){
    if(!btn) return;
    btn.innerHTML = '<span class="v16-tab-icon">'+icon+'</span><span class="v16-tab-label">'+label+'</span>';
    btn.setAttribute('aria-label', label);
  }

  function jpLevel(value){
    return value === 'advanced' ? '上級' : value === 'intermediate' ? '中級' : '初級';
  }
  function jpGenre(value){
    const map = {
      all:'全部', greeting:'挨拶', cafe:'カフェ', restaurant:'食事', shopping:'買物',
      transport:'交通', hotel:'ホテル', tourism:'観光', daily:'日常会話', work:'仕事', emergency:'緊急'
    };
    return map[value] || value || 'ジャンル';
  }

  function makeMetaItem(kind, select){
    if(!select) return null;
    let item = document.querySelector('.v16-meta-item[data-kind="'+kind+'"]');
    if(!item){
      item = document.createElement('div');
      item.className = 'v16-meta-item';
      item.dataset.kind = kind;
      item.innerHTML =
        '<span class="v16-meta-icon">'+(kind === 'level' ? icons.level : icons.tag)+'</span>' +
        '<span class="v16-meta-text"></span>';
    }
    if(select.parentElement !== item) item.appendChild(select);
    return item;
  }

  function refreshMetaText(){
    const levelSelect = document.getElementById('v12LevelSelect') || document.getElementById('v11LevelSelect');
    const categorySelect = document.getElementById('categorySelect');
    const levelText = document.querySelector('.v16-meta-item[data-kind="level"] .v16-meta-text');
    const categoryText = document.querySelector('.v16-meta-item[data-kind="category"] .v16-meta-text');
    if(levelText && levelSelect) levelText.textContent = 'レベル：' + jpLevel(levelSelect.value);
    if(categoryText && categorySelect) categoryText.textContent = 'ジャンル：' + jpGenre(categorySelect.value);
  }

  function applyV16(){
    const play = document.getElementById('playViewBtn');
    const list = document.getElementById('listViewBtn');
    const question = document.getElementById('questionViewBtn');
    const word = document.getElementById('wordViewBtn');
    setTab(play, icons.hear, '聞く');
    setTab(list, icons.read, '読む');
    setTab(question, icons.quiz, 'クイズ');
    if(word){ word.hidden = true; word.setAttribute('aria-hidden','true'); word.tabIndex = -1; }

    const app = document.querySelector('.app');
    const controls = document.querySelector('.controls');
    let bar = document.getElementById('v12MetaSelectBar');
    if(app && controls && !bar){
      bar = document.createElement('div');
      bar.id = 'v12MetaSelectBar';
      controls.insertAdjacentElement('afterend', bar);
    }
    if(bar){
      bar.classList.add('v16-meta-bar');
      const levelSelect = document.getElementById('v12LevelSelect') || document.getElementById('v11LevelSelect');
      const categorySelect = document.getElementById('categorySelect');
      const levelItem = makeMetaItem('level', levelSelect);
      const catItem = makeMetaItem('category', categorySelect);
      if(levelItem && levelItem.parentElement !== bar) bar.appendChild(levelItem);
      if(catItem && catItem.parentElement !== bar) bar.appendChild(catItem);
      refreshMetaText();
      [levelSelect, categorySelect].forEach(function(sel){
        if(sel && !sel.dataset.v16MetaBound){
          sel.dataset.v16MetaBound = '1';
          sel.addEventListener('change', function(){ setTimeout(refreshMetaText,0); });
        }
      });
    }
    const meta = document.querySelector('meta[name="lingoflow-app-version"]');
    if(meta) meta.setAttribute('content', VERSION);
  }

  const prevUpdate = window.updateButtons;
  window.updateButtons = function(){
    if(typeof prevUpdate === 'function') prevUpdate.apply(this, arguments);
    applyV16();
  };

  const prevRenderBottom = window.renderUnifiedBottomActionBar;
  if(typeof prevRenderBottom === 'function'){
    window.renderUnifiedBottomActionBar = function(){
      const result = prevRenderBottom.apply(this, arguments);
      applyV16();
      return result;
    };
  }

  document.addEventListener('DOMContentLoaded', applyV16);
  setTimeout(applyV16, 0);
  setTimeout(applyV16, 250);
})();
</script>

    if(meta) meta.setAttribute('content', VERSION);

  }
  function fixGenreAll(){
    const categorySelect = document.getElementById('categorySelect');
    if(categorySelect){
      const allOpt = categorySelect.querySelector('option[value="all"]');
      if(allOpt) allOpt.textContent = '全部';

      categorySelect.setAttribute('aria-label', categorySelect.value === 'all' ? 'ジャンル：全部' : 'ジャンル：' + categorySelect.options[categorySelect.selectedIndex].textContent);

    const categoryText = document.querySelector('.v16-meta-item[data-kind="category"] .v16-meta-text');

      const label = categorySelect.value === 'all' ? '全部' : categorySelect.options[categorySelect.selectedIndex].textContent;
      categoryText.textContent = 'ジャンル：' + label;
    }
  }
  const prevUpdate = window.updateButtons;
  window.updateButtons = function(){
    if(typeof prevUpdate === 'function') prevUpdate.apply(this, arguments);
    setVersion();
    fixGenreAll();
  };
  document.addEventListener('DOMContentLoaded', function(){ setVersion(); fixGenreAll(); });
  setTimeout(function(){ setVersion(); fixGenreAll(); }, 0);
  setTimeout(function(){ setVersion(); fixGenreAll(); }, 300);
})();
</script>

<script>
(function(){
  'use strict';
  const VERSION = '2026-05-23-v18-detached-bottom-groups';
  function setVersionV18(){
    const meta = document.querySelector('meta[name="lingoflow-app-version"]');
    if(meta) meta.setAttribute('content', VERSION);
    if(document.body) document.body.setAttribute('data-lingoflow-v18', VERSION);
  }
  function isAutoPlayingV18(){ return view === 'continuous' || view === 'random'; }
  function activeDirectionV18(){ return mode === 'speaking' ? 'jpzh' : 'zhjp'; }
  function activeContentV18(){ return contentMode === 'word' ? 'word' : 'sentence'; }
  function activeOrderV18(){ return autoMode === 'random' ? 'random' : 'continuous'; }
  function iconV18(group, value){
    if(group === 'content') return value === 'sentence' ? '▤' : 'Aa';
    if(group === 'run') return value === 'play' ? '▶' : '■';
    if(group === 'order') return value === 'continuous' ? '☷' : '⌘';
    if(group === 'direction') return value === 'zhjp' ? '→' : '←';
    return '';
  }
  function labelV18(label){ return String(label).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function buttonV18(label, group, value, active){
    return '<button type="button" data-v15-toggle="'+group+'" data-v15-value="'+value+'" class="'+(active ? 'active' : '')+'" aria-pressed="'+(active ? 'true' : 'false')+'">' +
      '<span class="v18-mini-icon" aria-hidden="true">'+iconV18(group,value)+'</span>' +
      '<span class="v18-label">'+labelV18(label)+'</span>' +
      '</button>';
  }
  function groupV18(name, buttons){
    return '<div class="v15-toggle-group" data-v15-group="'+name+'">'+buttons.join('')+'</div>';
  }
  function setContentV18(next){
    stopAudio();
    contentMode = next === 'word' ? 'word' : 'sentence';
    if(contentMode === 'word' && view === 'question' && !wordQuestionMode) wordQuestionMode = 'zhpinyin';
    wordQuestionRevealed = false;
    step = 0; history = []; index = -1;
    track('content_mode_change', {contentMode, source:'v18_detached_toggle'});
    updateButtons();
    if(view === 'list') renderList();
    else if(view === 'player') renderPlaybackPanel();
    else if(view === 'question') renderQuestion();
  }
  function setRunV18(next){
    if(next === 'stop'){
      stopPlaybackManual();
      updateButtons();
      return;
    }
    if(view !== 'continuous' && view !== 'random') setView(autoMode === 'random' ? 'random' : 'continuous');
    else startOrResumePlayback();
  }
  function setOrderV18(next){
    autoMode = next === 'random' ? 'random' : 'continuous';
    track('play_mode_select', {playMode:autoMode, source:'v18_detached_toggle'});
    if(isAutoPlayingV18()) setAutoPlayback(autoMode);
    else updateButtons();
  }
  function setDirectionV18(next){
    stopAudio();
    mode = next === 'jpzh' ? 'speaking' : 'reading';
    step = 0;
    track('mode_change', {mode, source:'v18_detached_toggle'});
    updateButtons();
    if(view === 'list') renderList();
    else if(view === 'player') renderPlaybackPanel();
    else if(view === 'question') renderQuestion();
  }
  function fixGenreAllV18(){
    const categorySelect = document.getElementById('categorySelect');
    if(categorySelect){
      const allOpt = categorySelect.querySelector('option[value="all"]');
      if(allOpt) allOpt.textContent = '全部';
      if(!categorySelect.value) categorySelect.value = 'all';
    }
    const categoryText = document.querySelector('.v16-meta-item[data-kind="category"] .v16-meta-text');
    if(categoryText && categorySelect){
      const label = categorySelect.value === 'all' ? '全部' : categorySelect.options[categorySelect.selectedIndex].textContent;
      categoryText.textContent = 'ジャンル：' + label;
    }
  }
  window.renderUnifiedBottomActionBar = function(){
    try{
      if(playViewBtn) playViewBtn.innerHTML = '<span class="v16-tab-icon" aria-hidden="true">🎧</span><span class="v16-tab-label">聞く</span>';
      if(listViewBtn) listViewBtn.innerHTML = '<span class="v16-tab-icon" aria-hidden="true">📖</span><span class="v16-tab-label">読む</span>';
      if(questionViewBtn) questionViewBtn.innerHTML = '<span class="v16-tab-icon" aria-hidden="true">?</span><span class="v16-tab-label">クイズ</span>';
      if(wordViewBtn){ wordViewBtn.hidden = true; wordViewBtn.setAttribute('aria-hidden','true'); wordViewBtn.tabIndex = -1; }
    }catch(e){}
    if(!bottomActionBar) return;
    if(contentBottomBar) contentBottomBar.classList.add('hidden-panel');
    if(wordQuestionModeBar) wordQuestionModeBar.classList.add('hidden-panel');
    if(playerBottomBar) playerBottomBar.classList.add('hidden-panel');
    const c = activeContentV18();
    const r = isAutoPlayingV18() ? 'play' : 'stop';
    const o = activeOrderV18();
    const d = activeDirectionV18();
    const html = [
      groupV18('content', [buttonV18('文章','content','sentence', c === 'sentence'), buttonV18('単語','content','word', c === 'word')]),
      groupV18('run', [buttonV18('再生中','run','play', r === 'play'), buttonV18('停止','run','stop', r === 'stop')]),
      groupV18('order', [buttonV18('連続','order','continuous', o === 'continuous'), buttonV18('ランダム','order','random', o === 'random')]),
      groupV18('direction', [buttonV18('中→日','direction','zhjp', d === 'zhjp'), buttonV18('日→中','direction','jpzh', d === 'jpzh')])
    ].join('');
    bottomActionBar.className = 'bottom-action-bar v15-action-bar v18-action-bar';
    bottomActionBar.innerHTML = html;
    document.body.classList.add('is-bottom-action-visible');
    document.body.classList.remove('is-content-toggle-visible','is-word-question-controls-visible');
    document.body.classList.toggle('is-player-controls-visible', isAutoPlayingV18());
    setVersionV18();
    fixGenreAllV18();
  };
  if(bottomActionBar && !bottomActionBar.dataset.v18Bound){
    bottomActionBar.dataset.v18Bound = '1';
    bottomActionBar.addEventListener('click', function(e){
      const b = e.target.closest('[data-v15-toggle]');
      if(!b || !bottomActionBar.contains(b)) return;
      e.preventDefault(); e.stopPropagation();
      const group = b.getAttribute('data-v15-toggle');
      const value = b.getAttribute('data-v15-value');
      if(group === 'content') setContentV18(value);
      else if(group === 'run') setRunV18(value);
      else if(group === 'order') setOrderV18(value);
      else if(group === 'direction') setDirectionV18(value);
    }, true);
  }
  const prevUpdateButtonsV18 = window.updateButtons;
  window.updateButtons = function(){
    if(typeof prevUpdateButtonsV18 === 'function') prevUpdateButtonsV18.apply(this, arguments);
    window.renderUnifiedBottomActionBar();
    setVersionV18();
    fixGenreAllV18();
  };
  document.addEventListener('DOMContentLoaded', function(){ setVersionV18(); fixGenreAllV18(); setTimeout(function(){ if(window.updateButtons) window.updateButtons(); },0); });
  setTimeout(function(){ setVersionV18(); fixGenreAllV18(); if(window.updateButtons) window.updateButtons(); }, 250);
})();
</script>
