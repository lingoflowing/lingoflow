<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LingoFlow v1 Phase1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <div class="image-area">
    <div class="image-placeholder">IMAGE</div>
  </div>

  <div class="word-area">
    <div class="zh">咖啡</div>
    <div class="pinyin">kā fēi</div>
    <div class="ja">コーヒー</div>
  </div>

  <div class="sentence-area">
    <div class="sentence-zh">今天想喝咖啡。</div>
    <div class="sentence-pinyin">jīn tiān xiǎng hē kā fēi</div>
    <div class="sentence-ja">今日はコーヒーが飲みたい。</div>
  </div>
</main>
</body>
</html>
