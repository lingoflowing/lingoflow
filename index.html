  function safeCategories(){
    try{
      if(typeof selectedCategories === 'function') return selectedCategories();
    }catch(e){}
    try{
      if(typeof category !== 'undefined' && category !== 'all') return [category];
      return Object.keys(categoryNames || {}).filter(function(c){ return c !== 'all'; });
    }catch(e){
      return [];
    }
  }

  function safeLevelLabel(lv){
    try{
      if(typeof levelNames !== 'undefined' && levelNames[lv]) return levelNames[lv];
    }catch(e){}
    return lv === 'beginner' ? '初級' : lv === 'intermediate' ? '中級' : lv === 'advanced' ? '上級' : '全部';
  }

  function renderSentenceListFixed(){
    try{
      currentListItems = [];
      let out = '<div class="list-status"></div>';
      const levelOrder = (typeof level !== 'undefined' && level === 'all') ? REAL_LEVELS : [level || 'beginner'];

      safeCategories().forEach(function(cat){
        levelOrder.forEach(function(lv){
          const rows = ((DATA && DATA[lv]) ? DATA[lv] : []).filter(function(p){
            return !cat || cat === 'all' || p.category === cat;
          });
          if(!rows.length) return;

          if(typeof listHeaderHtml === 'function'){
            out += listHeaderHtml(cat, lv);
          }else{
            out += '<div class="category-title">' + esc(cat) + '</div><div class="level-title">' + esc(safeLevelLabel(lv)) + '</div>';
          }

          rows.forEach(function(p){
            const id = currentListItems.length;
            currentListItems.push(Object.assign({ type:'sentence' }, p));
            out += '<div class="list-item" data-id="' + id + '">' +
              '<div class="list-zh">' + esc(p.zh) + '</div>' +
              '<div class="list-pinyin">' + esc(p.pinyin) + '</div>' +
              '<div class="list-jp">' + esc(p.jp) + '</div>' +
            '</div>';
          });
        });
      });

      listPanel.innerHTML = currentListItems.length ? out : '<div class="error">表示できる文章データがありません。</div>';
    }catch(e){
      try{ listPanel.innerHTML = '<div class="error">文章一覧の表示でエラーが発生しました。</div>'; }catch(_e){}
      try{ console.error('renderSentenceListFixed error', e); }catch(_e){}

  window.renderSentenceList = renderSentenceListFixed;

      '<button type="button" data-fixed-nav="next">次</button>';

    document.body.appendChild(nav);

    nav.addEventListener('click', function(e){
      const btn = e.target.closest('[data-fixed-nav]');
      if(!btn) return;
      e.preventDefault();
      e.stopPropagation();
      const action = btn.getAttribute('data-fixed-nav');
      handleFixedNav(action);
    }, true);

    return nav;
  }

  function isListenView(){
    return view === 'player' || view === 'continuous' || view === 'random';
  }

  function shouldShowFixedNav(){
    try{
      if(view === 'question') return true;
      if(isListenView() && contentMode !== 'word') return true;
    }catch(e){}
    return false;
  }

  function syncFixedNav(){
    const nav = ensureFixedNav();
    const show = shouldShowFixedNav();
    nav.classList.toggle('hidden-panel', !show);
    document.body.classList.toggle('has-fixed-card-nav', show);
  }

  function currentSentence(){
    try{
      if(history && history[index]) return history[index];
    }catch(e){}
    return null;
  }

  async function replayCurrent(){
    try{
      const p = currentSentence();
      if(!p){
        if(typeof nextQuestion === 'function') nextQuestion(true);
        return;
      }

      if(view === 'question'){
        if(typeof speakQuestionCurrent === 'function') await speakQuestionCurrent();
        else if(typeof speakChinese === 'function') await speakChinese(p.zh);
        return;
      }

      if(isListenView()){
        stopAudio();
        if(typeof renderAuto === 'function') renderAuto(p);
        if(typeof speakChinese === 'function') await speakChinese(p.zh);
        if(typeof speakJapanese === 'function') await speakJapanese(p.jp);
      }
    }catch(e){}
  }

  function prevForListen(){
    try{
      stopAudio();
      if(index > 0) index -= 1;
      const p = history[index] || history[0] || null;
      if(p && typeof renderAuto === 'function') renderAuto(p);
    }catch(e){}
  }

  function nextForListen(){
    try{
      stopAudio();
      let p = null;
      if(typeof pick === 'function') p = pick();
      if(!p && typeof getList === 'function'){
        const list = getList();
        p = list && list.length ? list[0] : null;
      }
      if(!p) return;
      history.push(p);
      index = history.length - 1;
      if(typeof renderAuto === 'function') renderAuto(p);
    }catch(e){}
  }

  function handleFixedNav(action){
    try{
      if(view === 'question'){
        if(action === 'prev' && typeof prevQuestion === 'function') return prevQuestion();
        if(action === 'replay') return replayCurrent();
        if(action === 'next' && typeof nextQuestion === 'function') return nextQuestion(true);
      }

      if(isListenView()){
        if(action === 'prev') return prevForListen();
        if(action === 'replay') return replayCurrent();

    };

  wrapNames.forEach(function(name){
    try{
      const original = window[name] || eval(name);

      const wrapped = function(){
        const r = original.apply(this, arguments);

      };
      window[name] = wrapped;
      try{ eval(name + ' = wrapped'); }catch(e){}
    }catch(e){}
  });

    setVersion();
    ensureFixedNav();
    syncFixedNav();
  }

  if(document.readyState === 'loading'){

        selectedLevelOrder().forEach(function(lv){

  window.currentWord = function(){
    const list = getWordList();
    if(!list.length) return null;
    wordIndex = normalizeWordIndex(wordIndex);
    return list[wordIndex];
  };
  try{ currentWord = window.currentWord; }catch(e){}

  window.currentWordCount = function(){
    return getWordList().length || 0;
  };
  try{ currentWordCount = window.currentWordCount; }catch(e){}

  function categoryLabelSafe(cat){
    try{ return typeof categoryLabel === 'function' ? categoryLabel(cat) : (categoryNames && categoryNames[cat]) || cat; }
    catch(e){ return cat || ''; }
  }

  function levelLabelSafe(lv){
    try{ return levelNames && levelNames[lv] ? levelNames[lv] : lv; }
    catch(e){ return lv || ''; }
  }

  window.renderWordList = function(){
    currentListItems = [];
    let out = '';

    const list = getWordList();
    if(!list.length){
      listPanel.innerHTML = '<div class="error">この条件で表示できる単語データがありません。</div>';
      return;
    }

    // Group by category, then level. No "単語一覧" explanation.
    const cats = [];
    list.forEach(function(w){
      if(!cats.includes(w.category)) cats.push(w.category);
    });

    cats.forEach(function(cat){
      const byCat = list.filter(function(w){ return w.category === cat; });
      const levels = REAL_WORD_LEVELS.filter(function(lv){
        return byCat.some(function(w){ return (w.level || 'beginner') === lv; });
      });
      (levels.length ? levels : ['beginner']).forEach(function(lv){
        const rows = byCat.filter(function(w){ return (w.level || 'beginner') === lv; });
        if(!rows.length) return;

        if(typeof listHeaderHtml === 'function') out += listHeaderHtml(cat, lv);
        else out += '<div class="list-group-head"><span class="list-head-genre">' + escSafe(categoryLabelSafe(cat)) + '</span><span class="list-head-level">' + escSafe(levelLabelSafe(lv)) + '</span></div>';

          const id = currentListItems.length;
          currentListItems.push(Object.assign({ type:'word' }, w));

              '</div>' +

    });

  try{ renderWordList = window.renderWordList; }catch(e){}

  const previousRenderList = window.renderList || (typeof renderList !== 'undefined' ? renderList : null);
  window.renderList = function(){
    if(contentMode === 'word') return renderWordList();
    if(typeof previousRenderList === 'function') return previousRenderList.apply(this, arguments);
  };
  try{ renderList = window.renderList; }catch(e){}

  function renderQuizWord(){
    const w = currentWord();
    if(!w){
      box.innerHTML = '<div class="error">この条件で出題できる単語データがありません。</div>';
      return;
    }

    const showAnswer = !!wordQuestionRevealed;
    const promptEmoji = wordQuestionMode === 'emoji';

    box.innerHTML =
      '<div class="question-card-top">' +
        '<div class="meta-left">' +
          '<span class="chip">' + escSafe(categoryLabelSafe(w.category)) + '</span>' +
          '<span class="chip">' + escSafe(levelLabelSafe(w.level || 'beginner')) + '</span>' +
        '</div>' +
        '<div class="counter">' + (wordIndex + 1) + ' / ' + currentWordCount() + '</div>' +
      '</div>' +
      '<div class="quiz-word-card">' +
        (promptEmoji ? '<div class="quiz-word-emoji" aria-hidden="true">' + escSafe(w.emoji || '🔤') + '</div>' : '') +
        '<div class="quiz-word-lines">' +
          (showAnswer || !promptEmoji ? '<div class="word-zh">' + escSafe(w.zh) + '</div>' : '<div class="word-zh hidden-line">' + escSafe(w.zh) + '</div>') +
          (showAnswer || !promptEmoji ? '<div class="word-pinyin">' + escSafe(w.pinyin) + '</div>' : '<div class="word-pinyin hidden-line">' + escSafe(w.pinyin) + '</div>') +
          (showAnswer ? '<div class="word-jp">' + escSafe(w.jp) + '</div>' : '<div class="word-jp hidden-line">' + escSafe(w.jp) + '</div>') +
        '</div>' +

  window.renderQuestion = function(){
    if(contentMode === 'word') return renderQuizWord();
    if(typeof previousRenderQuestion === 'function') return previousRenderQuestion.apply(this, arguments);
  };
  try{ renderQuestion = window.renderQuestion; }catch(e){}

  // Word quiz tap behavior: reveal -> next.
  const previousNextStep = window.nextStep || (typeof nextStep !== 'undefined' ? nextStep : null);
  window.nextStep = function(){
    if(view === 'question' && contentMode === 'word'){
      const list = getWordList();
      if(!list.length) return renderQuizWord();
      if(!wordQuestionRevealed){
        wordQuestionRevealed = true;
        return renderQuizWord();
      }
      wordQuestionRevealed = false;
      wordIndex = normalizeWordIndex(wordIndex + 1);
      return renderQuizWord();
    }
    if(typeof previousNextStep === 'function') return previousNextStep.apply(this, arguments);
  };
  try{ nextStep = window.nextStep; }catch(e){}

  // Fix old code that forced word mode to beginner by resyncing after level/category changes.
  function refreshIfNeeded(){
    try{
      if(view === 'list' && contentMode === 'word') renderWordList();
      if(view === 'question' && contentMode === 'word') renderQuizWord();
    }catch(e){}
  }

  const previousUpdateButtons = window.updateButtons;
  if(typeof previousUpdateButtons === 'function'){
    window.updateButtons = function(){
      const r = previousUpdateButtons.apply(this, arguments);
      setVersion();
      refreshIfNeeded();
      return r;
    };
  }

  function apply(){
    setVersion();
    if(typeof levelNames !== 'undefined') levelNames.all = '全部';
    refreshIfNeeded();
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){
      apply();
      setTimeout(apply, 0);
      setTimeout(apply, 300);
    }, { once:true });
  }else{
    apply();
    setTimeout(apply, 0);
    setTimeout(apply, 300);
  }
})();

(function(){
  'use strict';
  const VERSION = "2026-05-24-v40-word-quiz-text-stop-preserve-v1";

  function setVersion(){
    try{
      const meta = document.querySelector('meta[name="lingoflow-app-version"]');

  function escSafe(v){

    catch(e){ return String(v ?? ''); }
  }

  function categoryText(cat){
    try{
      if(typeof categoryLabel === 'function') return categoryLabel(cat);
      if(typeof categoryNames !== 'undefined' && categoryNames[cat]) return categoryNames[cat];
    }catch(e){}
    return cat || '';
  }

  function levelTextFromValue(lv){
    try{
      if(typeof levelNames !== 'undefined' && levelNames[lv]) return levelNames[lv];
    }catch(e){}
    return lv === 'beginner' ? '初級' : lv === 'intermediate' ? '中級' : lv === 'advanced' ? '上級' : '全部';
  }

  function detectSentenceLevel(p){
    try{
      for(const lv of ['beginner','intermediate','advanced']){
        const rows = DATA && DATA[lv] ? DATA[lv] : [];
        if(rows.some(function(r){ return r === p || (r.zh === p.zh && r.pinyin === p.pinyin && r.jp === p.jp && r.category === p.category); })){
          return lv;
        }
      }
    }catch(e){}
    return level && level !== 'all' ? level : 'beginner';
  }

  function currentQuizMeta(){
    try{
      if(contentMode === 'word'){
        const w = typeof currentWord === 'function' ? currentWord() : null;
        return {
          category: categoryText(w && w.category),
          level: levelTextFromValue((w && w.level) || (level && level !== 'all' ? level : 'beginner'))
        };
      }

      const p = history && history[index] ? history[index] : null;
      return {
        category: categoryText(p && p.category),
        level: levelTextFromValue(detectSentenceLevel(p || {}))
      };
    }catch(e){
      return { category:'挨拶', level:'初級' };
    }

    return '<div class="quiz-meta-pills" aria-label="' + escSafe(meta.category) + ' ' + escSafe(meta.level) + '">' +
      '<span class="quiz-meta-genre">' + escSafe(meta.category) + '</span>' +
      '<span class="quiz-meta-level">' + escSafe(meta.level) + '</span>' +
    '</div>';

    try{
      if(view !== 'question') return;

      const top = box.querySelector('.question-card-top, .quiz-card-top');
      if(!top) return;

      top.classList.add('quiz-card-top');

      const oldMeta = top.querySelector('.meta-left');
      if(oldMeta) oldMeta.remove();

      const existing = top.querySelector('.quiz-meta-pills');
      if(existing) existing.remove();

      const counter = top.querySelector('.counter');
      const wrap = document.createElement('div');
      wrap.innerHTML = metaHtml(currentQuizMeta());

      top.insertBefore(wrap.firstElementChild, counter || top.firstChild);
    }catch(e){}
  }

  const prevRenderQuestion = window.renderQuestion || (typeof renderQuestion !== 'undefined' ? renderQuestion : null);
  if(typeof prevRenderQuestion === 'function'){
    window.renderQuestion = function(){
      const r = prevRenderQuestion.apply(this, arguments);
      injectQuizMeta();
      setVersion();
      return r;
    };
    try{ renderQuestion = window.renderQuestion; }catch(e){}

  function apply(){
    setVersion();
    injectQuizMeta();
  }

  const prevUpdate = window.updateButtons;
  if(typeof prevUpdate === 'function'){
    window.updateButtons = function(){
      const r = prevUpdate.apply(this, arguments);
      apply();
      return r;
    };
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){

      setTimeout(apply, 0);
      setTimeout(apply, 300);
    }, { once:true });
  }else{
    apply();
    setTimeout(apply, 0);
    setTimeout(apply, 300);
  }
})();

<script>

   Root cause:
   - 聞く→文章の fixed nav が prevQuestion/nextQuestion を呼び、クイズ用 render 経路へ落ちていた。
   - 停止時も「現在の聞くカード」ではなく renderPlaybackPanel / 初期描画に戻る経路が残っていた。
   Countermeasure:
   - 聞く→文章専用の current sentence store + render function を最終上書き。
   - fixedCardNav を clone して古い click listener を除去し、聞く→文章では専用 prev/replay/next だけを使う。
   - stop / renderPlaybackPanel / renderAuto を同一 renderListenSentence に統一。
*/
(function(){
  'use strict';
  const VERSION = '2026-05-24-v52-word-quiz-nav-reset-question-v1';
  let v46Sentence = null;
  let v46SentencePos = 0;
  let v46LastMode = 'continuous';

  function setVersion(){
    try{
      const meta = document.querySelector('meta[name="lingoflow-app-version"]');

  function catV(c){
    try{ return typeof categoryLabel === 'function' ? categoryLabel(c) : ((typeof categoryNames !== 'undefined' && categoryNames[c]) || c || ''); }

  function categoriesForNow(){

    try{
      if(typeof level !== 'undefined' && level && level !== 'all') return [level];

  function sentenceList(){

<script>

<script>
/* ===== 2026-05-24-v52-word-quiz-nav-reset-question-v1 =====
   クイズ→単語 nav 修正:
   - 前 / 次 を押した時は、必ず未回答の「問題」だけを表示する。
   - 直前が答え表示中でも、答え状態を引き継がない。
   - 画面クリック時の 1回目=答え表示、2回目=次問題 の流れは維持。
   - v50/v51 の pill・文字品位・上下ズレ防止を維持。
*/
(function(){
  'use strict';
  const VERSION = '2026-05-24-v52-word-quiz-nav-reset-question-v1';
  const CATEGORY_LABELS = {
    all:'全部', greeting:'挨拶', cafe:'カフェ', restaurant:'食事', shopping:'買物',
    transport:'交通', hotel:'ホテル', tourism:'観光', daily:'日常', work:'仕事', emergency:'緊急'
  };
  const LEVEL_LABELS = {beginner:'初級', intermediate:'中級', advanced:'上級', all:'全部'};
  let lastTapAt = 0;
  let speakToken = 0;

  function setVersion(){
    try{
      const meta = document.querySelector('meta[name="lingoflow-app-version"]');
      if(meta) meta.setAttribute('content', VERSION);
      window.LINGOFLOW_APP_VERSION = VERSION;
      if(document.body) document.body.setAttribute('data-lingoflow-final-version', VERSION);
    }catch(e){}
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>\"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
  }
  function chars(s){
    return String(s == null ? '' : s).split('').map(function(ch){ return '<span class="char">' + esc(ch) + '</span>'; }).join('');
  }
  function isWordQuiz(){
    try{ return view === 'question' && contentMode === 'word'; }catch(e){ return false; }
  }
  function getWords(){
    try{ if(typeof getWordList === 'function') return getWordList() || []; }catch(e){}
    try{ return WORDS || []; }catch(e){ return []; }
  }
  function normalize(i){
    try{ if(typeof normalizeWordIndex === 'function') return normalizeWordIndex(i); }catch(e){}
    const list = getWords();
    const n = list.length || 1;
    return ((Number(i)||0) % n + n) % n;
  }
  function getWord(){
    try{ if(typeof currentWordQuestion === 'function') return currentWordQuestion(); }catch(e){}
    const list = getWords();
    return list.length ? list[normalize(wordIndex || 0)] : null;
  }
  function totalWords(){
    try{ if(typeof currentWordCount === 'function') return currentWordCount(); }catch(e){}
    return getWords().length;
  }
  function categoryText(w){
    const c = (w && w.category) || 'greeting';
    return CATEGORY_LABELS[c] || c || '挨拶';
  }
  function levelText(w){
    const lv = (w && w.level) || 'beginner';
    return LEVEL_LABELS[lv] || '初級';
  }
  function direction(){
    try{ return mode === 'speaking' ? 'jpzh' : 'zhjp'; }catch(e){ return 'zhjp'; }
  }
  function stopSpeech(){
    speakToken++;
    try{ if(typeof stopAudio === 'function') stopAudio(); }catch(e){}
    try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  }
  function answerBlock(html, revealed){
    return '<div class="quiz-answer-slot-v50"><div class="quiz-answer-block-v49 quiz-answer-block-v50' + (revealed ? '' : ' is-hidden') + '">' + html + '</div></div>';
  }
  function renderWordQuizV52(){
    const boxEl = (typeof box !== 'undefined' && box) ? box : document.getElementById('box');
    if(!boxEl || !isWordQuiz()) return;
    const w = getWord();
    if(!w){ boxEl.innerHTML = '<div class="error">表示できる単語データがありません。</div>'; return; }
    const revealed = !!wordQuestionRevealed;
    let right = '';
    if(direction() === 'jpzh'){
      right += '<div class="quiz-prompt-slot-v50"><div class="quiz-word-jp-v49 quiz-prompt-line-v49">' + esc(w.jp) + '</div></div>';
      right += answerBlock('<div class="quiz-word-zh-v49">' + chars(w.zh) + '</div><div class="quiz-word-pinyin-v49">' + esc(w.pinyin) + '</div>', revealed);
    }else{
      right += '<div class="quiz-prompt-slot-v50"><div class="quiz-word-zh-v49 quiz-prompt-line-v49">' + chars(w.zh) + '</div></div>';
      right += answerBlock('<div class="quiz-word-pinyin-v49">' + esc(w.pinyin) + '</div><div class="quiz-word-jp-v49">' + esc(w.jp) + '</div>', revealed);
    }
    boxEl.innerHTML =
      '<div class="question-card-top quiz-card-top">' +
        '<div class="quiz-meta-pills" aria-label="' + esc(categoryText(w)) + ' ' + esc(levelText(w)) + '">' +
          '<span class="quiz-meta-genre">' + esc(categoryText(w)) + '</span>' +
          '<span class="quiz-meta-level">' + esc(levelText(w)) + '</span>' +
        '</div>' +
        '<div class="counter">' + esc((Number(wordIndex || 0) + 1) + ' / ' + totalWords()) + '</div>' +
      '</div>' +
      '<div class="quiz-word-card-v47 quiz-word-card-v48 quiz-word-card-v49 quiz-word-card-v50 quiz-word-card-v52" role="button" tabindex="0" aria-label="単語クイズ">' +
        '<div class="quiz-word-emoji-v47 quiz-word-emoji-v48 quiz-word-emoji-v49 quiz-word-emoji-v50" aria-hidden="true">' + esc(w.emoji || '🔤') + '</div>' +
        '<div class="quiz-word-lines-v47 quiz-word-lines-v48 quiz-word-lines-v49 quiz-word-lines-v50">' + right + '</div>' +
      '</div>';
    try{ if(typeof cleanBadStatus === 'function') cleanBadStatus(); }catch(e){}
    try{ if(typeof showFixedNavSoon === 'function') showFixedNavSoon(); }catch(e){}
  }
  function renderQuestionOnly(){
    try{ wordQuestionRevealed = false; }catch(e){}
    renderWordQuizV52();
  }
  function moveWord(delta){
    if(!isWordQuiz()) return;
    stopSpeech();
    try{ wordIndex = normalize(Number(wordIndex || 0) + delta); }catch(e){}
    renderQuestionOnly();
    setTimeout(renderQuestionOnly, 0);
    setTimeout(renderQuestionOnly, 140);
  }
  async function revealAndSpeak(){
    if(!isWordQuiz()) return;
    const w = getWord();
    if(!w) return;
    try{ wordQuestionRevealed = true; }catch(e){}
    renderWordQuizV52();
    const token = ++speakToken;
    try{
      if(typeof speakHighlight === 'function') await speakHighlight(w.zh);
      else if(typeof speakWordAudio === 'function') await speakWordAudio(w.zh);
      else if(typeof speakChinese === 'function') await speakChinese(w.zh);
    }catch(e){}
    if(token === speakToken && isWordQuiz()) renderWordQuizV52();
  }
  function bindFixedNav(){
    const nav = document.getElementById('fixedCardNav');
    if(!nav || nav.dataset.v52Bound === '1') return;
    const clone = nav.cloneNode(false);
    clone.id = 'fixedCardNav';
    clone.className = (nav.className || '') + ' fixed-card-nav';
    clone.setAttribute('aria-label','カード操作');
    clone.innerHTML = '<button type="button" data-fixed-nav="prev">前</button><button type="button" data-fixed-nav="replay">もう一度</button><button type="button" data-fixed-nav="next">次</button>';
    clone.dataset.v52Bound = '1';
    nav.parentNode.replaceChild(clone, nav);
    clone.addEventListener('click', function(e){
      const btn = e.target.closest('[data-fixed-nav]');
      if(!btn) return;
      if(!isWordQuiz()) return;
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();

  }
  function patchGlobals(){
    try{ window.renderWordQuestion = renderWordQuizV52; renderWordQuestion = renderWordQuizV52; }catch(e){}
    const prevRenderQuestion = window.renderQuestion || (typeof renderQuestion !== 'undefined' ? renderQuestion : null);
    window.renderQuestion = function(){
      if(isWordQuiz()) return renderWordQuizV52();
      if(typeof prevRenderQuestion === 'function') return prevRenderQuestion.apply(this, arguments);
    };
    try{ renderQuestion = window.renderQuestion; }catch(e){}

    const oldNext = window.nextQuestion || (typeof nextQuestion !== 'undefined' ? nextQuestion : null);
    window.nextQuestion = function(){
      if(isWordQuiz()){ moveWord(1); return; }
      if(typeof oldNext === 'function') return oldNext.apply(this, arguments);
    };
    try{ nextQuestion = window.nextQuestion; }catch(e){}

    const oldPrev = window.prevQuestion || (typeof prevQuestion !== 'undefined' ? prevQuestion : null);
    window.prevQuestion = function(){
      if(isWordQuiz()){ moveWord(-1); return; }
      if(typeof oldPrev === 'function') return oldPrev.apply(this, arguments);
    };
    try{ prevQuestion = window.prevQuestion; }catch(e){}
  }
  document.addEventListener('click', function(e){
    if(!isWordQuiz()) return;
    const qnav = e.target.closest('[data-qnav]');
    if(qnav){
      const a = qnav.getAttribute('data-qnav');
      if(a === 'prev' || a === 'next'){
        e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
        moveWord(a === 'prev' ? -1 : 1);
        return;
      }
    }
    if(e.target.closest('[data-fixed-nav], [data-v15-toggle], .view-tabs, #v12MetaSelectBar, select, button')) return;
    const card = e.target.closest('.quiz-word-card-v52, .quiz-word-card-v50, .box, #box');
    if(!card) return;
    const now = Date.now();
    if(now - lastTapAt < 250) return;
    lastTapAt = now;
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    if(wordQuestionRevealed) moveWord(1);
    else revealAndSpeak();
  }, true);
  document.addEventListener('touchend', function(){
    if(isWordQuiz()) setTimeout(bindFixedNav, 0);
  }, true);
  function apply(){
    setVersion(); patchGlobals(); bindFixedNav();
    if(isWordQuiz()) renderWordQuizV52();
  }
  try{
    const mo = new MutationObserver(function(){
      if(!isWordQuiz()) return;
      bindFixedNav();
      const boxEl = (typeof box !== 'undefined' && box) ? box : document.getElementById('box');
      const txt = (boxEl && boxEl.textContent) || '';
      if(/タップして中国語|タップしてピンイン・日本語|greeting|cafe|restaurant|shopping|transport|hotel|tourism|daily|work|emergency|単語/.test(txt) || (boxEl && !boxEl.querySelector('.quiz-word-card-v52'))){
        setTimeout(renderWordQuizV52, 0);
      }
    });
    if(document.body) mo.observe(document.body, {childList:true, subtree:true, characterData:true});
  }catch(e){}
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ apply(); setTimeout(apply,0); setTimeout(apply,300); }, {once:true});
  else { apply(); setTimeout(apply,0); setTimeout(apply,300); }
})();
</script>

<script>
/* ===== 2026-05-24-v53-stable-controller-v1 =====
   目的:
   - v52をベースに、UIを変えずに状態管理だけ安定化。
   - renderCurrentState() / audioController / appState を唯一の入口にする。
   - 聞く→文章の停止保持、pill維持、クイズ→単語のreveal/nav状態を再発防止。
*/
(function(){
  'use strict';
  const VERSION = '2026-05-24-v53-stable-controller-v1';
  const CAT = {all:'全部',greeting:'挨拶',cafe:'カフェ',restaurant:'食事',shopping:'買物',transport:'交通',hotel:'ホテル',tourism:'観光',daily:'日常',work:'仕事',emergency:'緊急'};
  const LV = {all:'全部',beginner:'初級',intermediate:'中級',advanced:'上級'};
  const LEVEL_ORDER = ['beginner','intermediate','advanced'];
  let tapGuardAt = 0;

  const appState = window.LingoFlowStateV53 = window.LingoFlowStateV53 || {
    view:'question', contentMode:'sentence', mode:'reading', autoMode:'continuous',
    index:0, wordIndex:0, quizReveal:false, isPlaying:false, audioToken:0,
    currentSentence:null, currentWord:null
  };

  function setVersion(){
    try{
      const meta = document.querySelector('meta[name="lingoflow-app-version"]');
      if(meta) meta.setAttribute('content', VERSION);
      window.LINGOFLOW_APP_VERSION = VERSION;
      if(document.body) document.body.setAttribute('data-lingoflow-final-version', VERSION);
    }catch(e){}
  }
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function chars(v){ return String(v == null ? '' : v).split('').map(ch => '<span class="char">'+esc(ch)+'</span>').join(''); }
  function boxEl(){ return (typeof box !== 'undefined' && box) ? box : document.getElementById('box'); }
  function syncFromGlobals(){
    try{ appState.view = view; }catch(e){}
    try{ appState.contentMode = contentMode; }catch(e){}
    try{ appState.mode = mode; }catch(e){}
    try{ appState.autoMode = autoMode; }catch(e){}
    try{ appState.index = Number(index || 0); }catch(e){}
    try{ appState.wordIndex = Number(wordIndex || 0); }catch(e){}
    try{ appState.quizReveal = !!wordQuestionRevealed; }catch(e){}
  }
  function commitToGlobals(){
    try{ view = appState.view; }catch(e){}
    try{ contentMode = appState.contentMode; }catch(e){}
    try{ mode = appState.mode; }catch(e){}
    try{ autoMode = appState.autoMode; }catch(e){}
    try{ index = appState.index; }catch(e){}
    try{ wordIndex = appState.wordIndex; }catch(e){}
    try{ wordQuestionRevealed = appState.quizReveal; }catch(e){}
  }
  function allSentences(){
    let rows = [];
    try{
      const lv = (typeof level !== 'undefined' ? level : 'all');
      const cat = (typeof category !== 'undefined' ? category : 'all');
      const sourceLevels = lv === 'all' ? LEVEL_ORDER : [lv];
      sourceLevels.forEach(k => {
        const arr = (DATA && DATA[k]) ? DATA[k] : [];
        arr.forEach(p => { if(cat === 'all' || p.category === cat) rows.push(p); });
      });
      if(!rows.length && DATA){ LEVEL_ORDER.forEach(k => (DATA[k]||[]).forEach(p => rows.push(p))); }
    }catch(e){}
    return rows;
  }
  function norm(n, len){ len = len || 1; return ((Number(n)||0) % len + len) % len; }
  function sentenceAt(n){ const rows = allSentences(); return rows.length ? rows[norm(n, rows.length)] : null; }
  function wordRows(){
    try{ if(typeof getWordList === 'function') return getWordList() || []; }catch(e){}
    try{ return WORDS || []; }catch(e){ return []; }
  }
  function wordAt(n){ const rows = wordRows(); return rows.length ? rows[norm(n, rows.length)] : null; }
  function catLabel(v){ return CAT[v] || v || '挨拶'; }
  function lvLabel(v){ return LV[v] || v || '初級'; }
  function cleanStatus(){
    try{ document.querySelectorAll('.status,.player-desc,.player-title').forEach(el => el.remove()); }catch(e){}
  }
  function showFixedNav(){
    try{
      const nav = document.getElementById('fixedCardNav');
      if(!nav) return;
      const show = (appState.view === 'player' || appState.view === 'continuous' || appState.view === 'random' || appState.view === 'question');
      nav.classList.toggle('hidden-panel', !show);
      document.body.classList.toggle('has-fixed-card-nav', show);
      if(show){ nav.style.display='grid'; nav.style.visibility='visible'; nav.style.opacity='1'; }
    }catch(e){}
  }
  function sentenceHeader(p, countText){
    const c = catLabel(p && p.category);
    const l = lvLabel((p && p.level) || 'beginner');
    return '<div class="question-card-top quiz-card-top">' +
      '<div class="quiz-meta-pills" aria-label="'+esc(c)+' '+esc(l)+'">' +
        '<span class="quiz-meta-genre">'+esc(c)+'</span>' +
        '<span class="quiz-meta-level">'+esc(l)+'</span>' +
      '</div>' +
      '<div class="counter">'+esc(countText || '')+'</div>' +
    '</div>';
  }
  function renderSentence(active){
    syncFromGlobals();
    const b = boxEl(); if(!b) return;
    let p = appState.currentSentence || sentenceAt(appState.index) || sentenceAt(0);
    if(!p){ b.innerHTML = '<div class="error">表示できる文章データがありません。</div>'; return; }
    appState.currentSentence = p;
    const rows = allSentences();
    const n = rows.length || 1;
    b.innerHTML = sentenceHeader(p, (norm(appState.index,n)+1)+' / '+n) +
      '<div class="card-main v53-sentence-card"><div class="lines-wrap">' +
        '<div class="line"><div class="zh'+(active?' audio-active':'')+'">'+chars(p.zh)+'</div></div>' +
        '<div class="line"><div class="pinyin">'+esc(p.pinyin)+'</div></div>' +
        '<div class="line"><div class="jp">'+esc(p.jp)+'</div></div>' +
      '</div></div>';
    cleanStatus(); showFixedNav();
  }
  function renderWordQuiz(){
    syncFromGlobals();
    const b = boxEl(); if(!b) return;
    const rows = wordRows();
    const n = rows.length || 1;
    const w = wordAt(appState.wordIndex);
    if(!w){ b.innerHTML = '<div class="error">表示できる単語データがありません。</div>'; return; }
    appState.currentWord = w;
    const revealed = !!appState.quizReveal;
    const jpToZh = appState.mode === 'speaking';
    let right = '';
    if(jpToZh){
      right += '<div class="quiz-prompt-slot-v50"><div class="quiz-word-jp-v49 quiz-prompt-line-v49">'+esc(w.jp)+'</div></div>';
      right += '<div class="quiz-answer-slot-v50"><div class="quiz-answer-block-v49 quiz-answer-block-v50'+(revealed?'':' is-hidden v53-hidden-answer')+'"><div class="quiz-word-zh-v49">'+chars(w.zh)+'</div><div class="quiz-word-pinyin-v49">'+esc(w.pinyin)+'</div></div></div>';
    }else{
      right += '<div class="quiz-prompt-slot-v50"><div class="quiz-word-zh-v49 quiz-prompt-line-v49">'+chars(w.zh)+'</div></div>';
      right += '<div class="quiz-answer-slot-v50"><div class="quiz-answer-block-v49 quiz-answer-block-v50'+(revealed?'':' is-hidden v53-hidden-answer')+'"><div class="quiz-word-pinyin-v49">'+esc(w.pinyin)+'</div><div class="quiz-word-jp-v49">'+esc(w.jp)+'</div></div></div>';
    }
    b.innerHTML = '<div class="question-card-top quiz-card-top">' +
      '<div class="quiz-meta-pills" aria-label="'+esc(catLabel(w.category || 'greeting'))+' '+esc(lvLabel(w.level || 'beginner'))+'">' +
        '<span class="quiz-meta-genre">'+esc(catLabel(w.category || 'greeting'))+'</span>' +
        '<span class="quiz-meta-level">'+esc(lvLabel(w.level || 'beginner'))+'</span>' +
      '</div>' +
      '<div class="counter">'+esc((norm(appState.wordIndex,n)+1)+' / '+n)+'</div>' +
    '</div>' +
    '<div class="quiz-word-card-v47 quiz-word-card-v48 quiz-word-card-v49 quiz-word-card-v50 quiz-word-card-v52 v53-word-quiz-card" role="button" tabindex="0" aria-label="単語クイズ">' +
      '<div class="quiz-word-emoji-v47 quiz-word-emoji-v48 quiz-word-emoji-v49 quiz-word-emoji-v50" aria-hidden="true">'+esc(w.emoji || '🔤')+'</div>' +
      '<div class="quiz-word-lines-v47 quiz-word-lines-v48 quiz-word-lines-v49 quiz-word-lines-v50">'+right+'</div>' +
    '</div>';
    cleanStatus(); showFixedNav();
  }
  function renderCurrentState(opts){
    opts = opts || {};
    setVersion(); syncFromGlobals();
    if(appState.view === 'question' && appState.contentMode === 'word') return renderWordQuiz();
    if((appState.view === 'player' || appState.view === 'continuous' || appState.view === 'random') && appState.contentMode !== 'word') return renderSentence(!!opts.audioActive);
    cleanStatus(); showFixedNav();
  }

  const audioController = window.LingoFlowAudioV53 = {
    token:0,
    stop(reason){
      this.token++; appState.audioToken = this.token; appState.isPlaying = false;
      try{ if(typeof autoId !== 'undefined') autoId++; }catch(e){}
      try{ if(typeof stopAudio === 'function') stopAudio(); }catch(e){}
      try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
      if(reason !== 'silent') renderCurrentState({audioActive:false});
    },
    async zh(text){
      try{ if(typeof speakHighlight === 'function') return await speakHighlight(text); }catch(e){}
      try{ if(typeof speakWordAudio === 'function') return await speakWordAudio(text); }catch(e){}
      try{ if(typeof speak === 'function') return await speak(text); }catch(e){}
    },
    async jp(text){
      try{ if(typeof speakJapanese === 'function') return await speakJapanese(text); }catch(e){}
    },
    async sentenceLoop(){
      const token = ++this.token; appState.audioToken = token; appState.isPlaying = true;
      try{ appState.view = (appState.autoMode === 'random') ? 'random' : 'continuous'; commitToGlobals(); updateButtons && updateButtons(); }catch(e){}
      while(token === this.token && appState.isPlaying){
        const rows = allSentences(); if(!rows.length) break;
        if(appState.autoMode === 'random') appState.index = Math.floor(Math.random()*rows.length);
        appState.currentSentence = sentenceAt(appState.index);
        commitToGlobals(); renderSentence(true);
        await this.zh(appState.currentSentence.zh);
        if(token !== this.token || !appState.isPlaying) break;
        await new Promise(r=>setTimeout(r,420));
        await this.jp(appState.currentSentence.jp);
        if(token !== this.token || !appState.isPlaying) break;
        await new Promise(r=>setTimeout(r,700));
        if(appState.autoMode !== 'random') appState.index = norm(appState.index + 1, rows.length);
      }
      if(token === this.token){ appState.isPlaying = false; appState.view='player'; commitToGlobals(); renderSentence(false); }
    },
    async revealWord(){
      const w = appState.currentWord || wordAt(appState.wordIndex); if(!w) return;
      const token = ++this.token; appState.audioToken = token;
      appState.quizReveal = true; commitToGlobals(); renderWordQuiz();
      await this.zh(w.zh);
      if(token === this.token) renderWordQuiz();
    }
  };

  function startManaged(){
    syncFromGlobals();
    if(appState.contentMode === 'word'){
      try{ if(typeof startOrResumeWordPlayback === 'function') return startOrResumeWordPlayback(); }catch(e){}
      return;
    }
    audioController.stop('silent');
    audioController.sentenceLoop();
  }
  function stopManaged(){
    syncFromGlobals();
    if(appState.contentMode !== 'word' && (appState.view === 'player' || appState.view === 'continuous' || appState.view === 'random')){
      appState.view = 'player'; commitToGlobals();
      audioController.stop('stop'); renderSentence(false); return;
    }
    audioController.stop('stop');
  }
  function moveSentence(delta){
    syncFromGlobals(); audioController.stop('silent');
    const rows = allSentences(); appState.index = norm(appState.index + delta, rows.length || 1);
    appState.currentSentence = sentenceAt(appState.index); appState.view = 'player'; appState.isPlaying = false;
    commitToGlobals(); try{ updateButtons && updateButtons(); }catch(e){} renderSentence(false);
  }
  function moveWordQuiz(delta){
    syncFromGlobals(); audioController.stop('silent');
    const rows = wordRows(); appState.wordIndex = norm(appState.wordIndex + delta, rows.length || 1); appState.quizReveal = false;
    commitToGlobals(); renderWordQuiz();
  }
  function replayCurrent(){
    syncFromGlobals();
    if(appState.view === 'question' && appState.contentMode === 'word') return audioController.revealWord();
    if((appState.view === 'player' || appState.view === 'continuous' || appState.view === 'random') && appState.contentMode !== 'word'){
      const p = appState.currentSentence || sentenceAt(appState.index); if(!p) return;
      audioController.stop('silent');
      (async function(){ const token = ++audioController.token; renderSentence(true); await audioController.zh(p.zh); if(token===audioController.token) await audioController.jp(p.jp); if(token===audioController.token) renderSentence(false); })();
    }
  }

  const oldStart = window.startOrResumePlayback || (typeof startOrResumePlayback !== 'undefined' ? startOrResumePlayback : null);
  window.startOrResumePlayback = function(){ syncFromGlobals(); if(appState.contentMode !== 'word') return startManaged(); if(typeof oldStart === 'function') return oldStart.apply(this, arguments); };
  try{ startOrResumePlayback = window.startOrResumePlayback; }catch(e){}
  const oldStop = window.stopPlaybackManual || (typeof stopPlaybackManual !== 'undefined' ? stopPlaybackManual : null);
  window.stopPlaybackManual = function(){ syncFromGlobals(); if(appState.contentMode !== 'word') return stopManaged(); if(typeof oldStop === 'function') return oldStop.apply(this, arguments); };
  try{ stopPlaybackManual = window.stopPlaybackManual; }catch(e){}
  const oldAuto = window.startAuto || (typeof startAuto !== 'undefined' ? startAuto : null);
  window.startAuto = function(){ syncFromGlobals(); if(appState.contentMode !== 'word') return audioController.sentenceLoop(); if(typeof oldAuto === 'function') return oldAuto.apply(this, arguments); };
  try{ startAuto = window.startAuto; }catch(e){}
  const oldRenderAuto = window.renderAuto || (typeof renderAuto !== 'undefined' ? renderAuto : null);
  window.renderAuto = function(p){ syncFromGlobals(); if(appState.contentMode !== 'word'){ if(p){ appState.currentSentence = p; } return renderSentence(true); } if(typeof oldRenderAuto === 'function') return oldRenderAuto.apply(this, arguments); };
  try{ renderAuto = window.renderAuto; }catch(e){}
  const oldPanel = window.renderPlaybackPanel || (typeof renderPlaybackPanel !== 'undefined' ? renderPlaybackPanel : null);
  window.renderPlaybackPanel = function(){ syncFromGlobals(); if(appState.contentMode !== 'word') return renderSentence(false); if(typeof oldPanel === 'function') return oldPanel.apply(this, arguments); };
  try{ renderPlaybackPanel = window.renderPlaybackPanel; }catch(e){}
  const oldQuestion = window.renderQuestion || (typeof renderQuestion !== 'undefined' ? renderQuestion : null);
  window.renderQuestion = function(){ syncFromGlobals(); if(appState.contentMode === 'word' && appState.view === 'question') return renderWordQuiz(); if(typeof oldQuestion === 'function') return oldQuestion.apply(this, arguments); };
  try{ renderQuestion = window.renderQuestion; window.renderWordQuestion = renderWordQuiz; renderWordQuestion = renderWordQuiz; }catch(e){}

  document.addEventListener('click', function(e){
    const t = e.target && e.target.closest ? e.target.closest('[data-v15-toggle], [data-player-control], [data-fixed-nav]') : null;
    if(!t) return;
    syncFromGlobals();
    const group = t.getAttribute('data-v15-toggle');
    const value = t.getAttribute('data-v15-value');
    const control = t.getAttribute('data-player-control');
    const nav = t.getAttribute('data-fixed-nav');
    if(group === 'run' || control === 'play' || control === 'stop'){
      if(appState.contentMode !== 'word'){
        e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
        if(value === 'play' || control === 'play') startManaged(); else stopManaged();
      }
      return;
    }
    if(nav){
      if(appState.view === 'question' && appState.contentMode === 'word'){
        e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
        if(nav === 'prev') moveWordQuiz(-1); else if(nav === 'next') moveWordQuiz(1); else audioController.revealWord();
        return;
      }
      if((appState.view === 'player' || appState.view === 'continuous' || appState.view === 'random') && appState.contentMode !== 'word'){
        e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
        if(nav === 'prev') moveSentence(-1); else if(nav === 'next') moveSentence(1); else replayCurrent();
      }
    }
  }, true);

  document.addEventListener('click', function(e){
    syncFromGlobals();
    if(!(appState.view === 'question' && appState.contentMode === 'word')) return;
    if(e.target.closest('[data-fixed-nav], [data-v15-toggle], [data-player-control], .view-tabs, #v12MetaSelectBar, select, button')) return;
    if(!e.target.closest('.v53-word-quiz-card, .quiz-word-card-v52, #box, .box')) return;
    const now = Date.now(); if(now - tapGuardAt < 250) return; tapGuardAt = now;
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    if(appState.quizReveal) moveWordQuiz(1); else audioController.revealWord();
  }, true);

  function apply(){
    setVersion(); syncFromGlobals();
    if(!appState.currentSentence) appState.currentSentence = sentenceAt(appState.index) || sentenceAt(0);
    if(!appState.currentWord) appState.currentWord = wordAt(appState.wordIndex) || wordAt(0);
    commitToGlobals(); renderCurrentState({audioActive:false});
    setTimeout(function(){ setVersion(); cleanStatus(); showFixedNav(); }, 60);
  }
  window.renderCurrentState = renderCurrentState;
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', apply, {once:true});
  else apply();
})();
</script>

</body>
</html>
