<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LingoFlow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app" aria-label="LingoFlow">
  <img id="photo" class="photo" src="images/morning.jpg" alt="scene">
  <button id="playStopButton" class="play-stop-button" type="button" aria-label="再生">
    <span id="playStopIcon" class="play-stop-icon" aria-hidden="true">
      <svg class="icon-play" viewBox="0 0 48 48" focusable="false" aria-hidden="true">
        <path d="M18 13.5 L36 24 L18 34.5 Z"></path>
      </svg>
      <svg class="icon-stop" viewBox="0 0 48 48" focusable="false" aria-hidden="true">
        <rect x="17" y="17" width="14" height="14" rx="3.5" ry="3.5"></rect>
      </svg>
    </span>
  </button>
</main>
<script src="app.js"></script>
</body>
</html>
