<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LingoFlow prototype v1</title>
  <meta name="description" content="台湾華語が、静かに流れる場所。">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== v55 iPhone SE compact height patch / JS hidden control ===== */
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100svh;
    }

    .app {
      min-height: 100svh;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 14px max(12px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      padding: 14px;
      border-radius: 24px;
    }

    .image-area {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }

    .image-area img {
      display: block;
      width: min(64vw, 210px);
      max-height: 30svh;
      object-fit: contain;
    }

    .text-area,
    .word-block,
    .sentence-block {
      width: 100%;
    }

    .word-block,
    .sentence-block {
      display: grid;
      gap: 4px;
      text-align: center;
    }

    .word-zh,
    .sentence-zh {
      font-size: clamp(26px, 8vw, 38px);
      line-height: 1.12;
      font-weight: 700;
    }

    .word-pinyin,
    .sentence-pinyin {
      font-size: clamp(15px, 4.5vw, 19px);
      line-height: 1.18;
    }

    .word-ja,
    .sentence-ja {
      font-size: clamp(15px, 4.5vw, 19px);
      line-height: 1.22;
    }

    .is-hidden {
      display: none !important;
    }

    .play-button {
      flex: 0 0 auto;
      width: 64px;
      height: 64px;
      border-radius: 999px;
      font-size: 26px;
      line-height: 1;
    }

    .status-text {
      margin: 0;
      min-height: 1.4em;
      font-size: 13px;
      line-height: 1.35;
      text-align: center;
    }

    @media (max-width: 340px) and (max-height: 700px) {
      .app {
        justify-content: flex-start;
        gap: 8px;
        padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom));
      }

      .card {
        padding: 12px;
        border-radius: 22px;
      }

      .image-area {
        margin-bottom: 8px;
      }

      .image-area img {
        width: min(58vw, 172px);
        max-height: 27svh;
      }

      .word-block,
      .sentence-block {
        gap: 3px;
      }

      .word-zh,
      .sentence-zh {
        font-size: clamp(24px, 7.6vw, 32px);
        line-height: 1.08;
      }

      .word-pinyin,
      .sentence-pinyin,
      .word-ja,
      .sentence-ja {
        font-size: clamp(14px, 4.2vw, 17px);
        line-height: 1.15;
      }

      .play-button {
        width: 56px;
        height: 56px;
        font-size: 23px;
      }

      .status-text {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-live="polite">
    <section class="card" id="card">
      <div class="image-area">
        <img id="cardImage" alt="">
      </div>

      <div class="text-area">
        <div id="wordBlock" class="word-block is-hidden">
          <div id="wordZh" class="word-zh"></div>
          <div id="wordPinyin" class="word-pinyin"></div>
          <div id="wordJa" class="word-ja"></div>
        </div>

        <div id="sentenceBlock" class="sentence-block is-hidden">
          <div id="sentenceZh" class="sentence-zh"></div>
          <div id="sentencePinyin" class="sentence-pinyin"></div>
          <div id="sentenceJa" class="sentence-ja"></div>
        </div>
      </div>
    </section>

    <button id="playButton" class="play-button" type="button" aria-label="再生">▶︎</button>
    <p id="statusText" class="status-text">押すと静かに始まります</p>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
