<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LingoFlow ambient v0.5</title>
  <link rel="stylesheet" href="./css/style.css?v=0.5">
</head>
<body>
  <main class="app" aria-label="LingoFlow">
    <section class="ambient-card" id="card">
      <div class="visual" id="visual" aria-hidden="true">
        <span id="visualIcon">☕</span>
      </div>

      <section class="copy">
        <div class="word">
          <div class="zh" id="wordZh">読み込み中</div>
          <div class="pinyin" id="wordPinyin"></div>
          <div class="ja" id="wordJa"></div>
        </div>

        <div class="sentence">
          <div class="sentence-zh" id="sentenceZh"></div>
          <div class="sentence-pinyin" id="sentencePinyin"></div>
          <div class="sentence-ja" id="sentenceJa"></div>
        </div>
      </section>
    </section>

    <button class="play-button" id="playButton" type="button" aria-label="再生">▶</button>
    <div class="build">v0.5 ambient</div>
  </main>

  <script type="module" src="./js/app.js?v=0.5"></script>
</body>
</html>
