<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LingoFlow Phase4</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section id="card" class="card fade">
    <div class="image-wrap">
      <div id="imageBox" class="image-box">朝の情景</div>
    </div>

    <div class="word">
      <div id="zh" class="zh">早安</div>
      <div id="py" class="py">zǎo ān</div>
      <div id="ja" class="ja">おはよう</div>
    </div>

    <div class="sentence">
      <div id="szh">今天也早安。</div>
      <div id="spy">jīn tiān yě zǎo ān</div>
      <div id="sja">今日もおはよう。</div>
    </div>
  </section>

  <button id="playBtn">▶︎</button>
</main>
<script src="app.js"></script>
</body>
</html>
