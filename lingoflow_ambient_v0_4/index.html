<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ee">
  <title>LingoFlow ambient v0.4</title>
  <meta name="description" content="台湾華語が、静かに流れる場所。">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="app" aria-label="LingoFlow">
    <section id="card" class="card" aria-live="polite">
      <div class="visual-wrap" aria-hidden="true">
        <div id="visual" class="visual visual-coffee">
          <div class="visual-mark"></div>
        </div>
      </div>

      <div class="text-wrap">
        <section class="word-block" aria-label="単語">
          <div id="wordZh" class="word-zh"></div>
          <div id="wordPinyin" class="word-pinyin"></div>
          <div id="wordJa" class="word-ja"></div>
        </section>

        <section class="sentence-block" aria-label="例文">
          <div id="sentenceZh" class="sentence-zh"></div>
          <div id="sentencePinyin" class="sentence-pinyin"></div>
          <div id="sentenceJa" class="sentence-ja"></div>
        </section>
      </div>
    </section>

    <button id="playButton" class="play-button" type="button" aria-label="再生">
      <span id="playIcon" aria-hidden="true">▶︎</span>
    </button>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
