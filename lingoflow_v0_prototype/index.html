<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LingoFlow Prototype</title>
  <meta name="description" content="台湾華語が、静かに流れる場所。">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="app" aria-live="polite">
    <header class="brand">
      <div class="brand-mark">流</div>
      <div>
        <h1>LingoFlow</h1>
        <p>台湾華語が、静かに流れる場所。</p>
      </div>
    </header>

    <section class="card" id="card">
      <div class="visual" role="img" aria-label="台湾の日常イラスト">
        <div id="imageLabel" class="visual-emoji">☕</div>
        <div id="theme" class="theme">朝 / カフェ</div>
      </div>

      <div class="content">
        <div class="word-block">
          <div id="wordZh" class="word-zh">咖啡</div>
          <div id="wordPinyin" class="pinyin">kā fēi</div>
          <div id="wordJa" class="ja">コーヒー</div>
        </div>

        <div class="sentence-block">
          <div id="sentenceZh" class="sentence-zh">今天想喝咖啡。</div>
          <div id="sentencePinyin" class="pinyin sentence-pinyin">jīn tiān xiǎng hē kā fēi</div>
          <div id="sentenceJa" class="ja sentence-ja">今日はコーヒーが飲みたい。</div>
        </div>
      </div>
    </section>

    <footer class="controls">
      <button id="playButton" class="play-button" type="button" aria-label="再生">▶</button>
      <div id="status" class="status">停止中</div>
      <div id="counter" class="counter">1 / 10</div>
    </footer>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
