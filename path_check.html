<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LingoFlow Phase52 Path Check</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Noto Sans TC",sans-serif;background:#f7f3ec;margin:0;padding:16px;color:#1f1b18}
.card{background:#fffaf2;border-radius:20px;margin:0 0 16px;overflow:hidden;border:1px solid #ddd0c0}
img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
.text{padding:14px 16px 16px}
.zh{font-size:32px;font-weight:650}
.py,.ja{color:#756b61}
</style>
</head>
<body>
<h1>LingoFlow Phase52 Path Check</h1>
<div id="app"></div>
<script>
fetch('./data/cards.json')
  .then(r => r.json())
  .then(data => {
    const cards = data.cards || [];
    document.getElementById('app').innerHTML = cards.map(c => `
      <article class="card">
        <img src="${c.imageFile}" alt="${c.wordJa}">
        <div class="text">
          <div class="zh">${c.wordZh}</div>
          <div class="py">${c.wordPinyin}</div>
          <div class="ja">${c.wordJa}</div>
          <p>${c.sentenceZh}<br><span class="py">${c.sentencePinyin}</span><br><span class="ja">${c.sentenceJa}</span></p>
        </div>
      </article>
    `).join('');
  });
</script>
</body>
</html>
