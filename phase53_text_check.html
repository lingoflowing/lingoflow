<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LingoFlow Phase53 Text Check</title>
<style>
body{margin:0;background:#f7f3ec;color:#1f1b18;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Noto Sans TC",sans-serif}
.app{width:min(430px,100%);margin:0 auto;padding:12px 10px 28px}
.card{background:#fffaf2;border:1px solid rgba(115,97,75,.16);border-radius:28px;overflow:hidden;box-shadow:0 14px 36px rgba(60,45,25,.08);margin-bottom:18px}
img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#eee3d3}
.text{padding:18px 18px 20px;text-align:center}
.zh{font-size:42px;line-height:1.1;font-weight:650;letter-spacing:.04em}
.py{font-size:15px;color:#756b61;margin-top:5px}.ja{font-size:14px;color:#756b61;margin-top:3px}
.s{border-top:1px solid #d8ccbd;margin-top:16px;padding-top:14px}
.szh{font-size:18px;line-height:1.55}.spy,.sja{font-size:13px;line-height:1.55;color:#756b61}
</style>
</head>
<body><main class="app" id="app"></main>
<script>
fetch('./data.json',{cache:'no-store'}).then(r=>r.json()).then(cards=>{
 document.getElementById('app').innerHTML = cards.map(c => `
  <article class="card">
    <img src="${c.imageFile || c.image}" alt="${c.wordJa || c.ja}">
    <div class="text">
      <div class="zh">${c.wordZh || c.zh}</div>
      <div class="py">${c.wordPinyin || c.pinyin}</div>
      <div class="ja">${c.wordJa || c.ja}</div>
      <div class="s">
        <div class="szh">${c.sentenceZh || c.sentence_zh}</div>
        <div class="spy">${c.sentencePinyin || c.sentence_pinyin}</div>
        <div class="sja">${c.sentenceJa || c.sentence_ja}</div>
      </div>
    </div>
  </article>`).join('');
});
</script></body></html>
